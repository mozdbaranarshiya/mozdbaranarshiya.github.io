<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تمدید حساب کاربری | پشتیبانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --accent: #ec4899;
    --accent-dark: #db2777;
    --bg-dark: #0a0a1a;
    --text-light: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.75);
    --border-glow: rgba(99, 102, 241, 0.4);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
  }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(236, 72, 153, 0.22), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1), transparent 60%);
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* گرید پس‌زمینه */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  /* حباب‌های نورانی شناور */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 420px; height: 420px;
    background: var(--primary);
    top: -140px; right: -120px;
    animation: float1 10s ease-in-out infinite;
  }
  .orb-2 {
    width: 360px; height: 360px;
    background: var(--accent);
    bottom: -140px; left: -120px;
    animation: float2 12s ease-in-out infinite;
  }
  .orb-3 {
    width: 240px; height: 240px;
    background: #a855f7;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.25;
    animation: float3 14s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-30px, 40px) scale(1.1); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -30px) scale(1.15); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-45%, -55%) scale(1.2); }
  }

  /* کارت اصلی */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
    background: rgba(20, 20, 40, 0.65);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 32px;
    padding: 48px 38px 42px;
    text-align: center;
    box-shadow: 
      0 30px 80px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 1px 0 rgba(255, 255, 255, 0.15) inset;
    animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  /* نوار رنگی بالای کارت */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent), #a855f7, var(--primary));
    background-size: 300% 100%;
    animation: gradientMove 4s linear infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(50px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* آیکون */
  .icon-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: 
      0 15px 40px rgba(99, 102, 241, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.15) inset;
    animation: iconPulse 3s ease-in-out infinite;
  }

  .icon-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 34px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    opacity: 0.35;
    filter: blur(20px);
    z-index: -1;
  }

  @keyframes iconPulse {
    0%, 100% { box-shadow: 0 15px 40px rgba(99, 102, 241, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.15) inset; }
    50% { box-shadow: 0 15px 55px rgba(236, 72, 153, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.2) inset; }
  }

  .icon-wrap svg {
    width: 48px;
    height: 48px;
    fill: #fff;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
  }

  /* عنوان */
  .title {
    color: var(--text-light);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ffffff, #c7d2fe);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 26px;
  }

  /* خط جداکننده */
  .divider {
    width: 70px;
    height: 4px;
    margin: 0 auto 28px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    box-shadow: 0 2px 12px rgba(99, 102, 241, 0.5);
  }

  /* متن اصلی */
  .message {
    color: rgba(255, 255, 255, 0.9);
    font-size: 16.5px;
    line-height: 2.1;
    font-weight: 500;
    margin-bottom: 22px;
  }

  .chip {
    display: inline-block;
    padding: 4px 14px;
    margin: 0 4px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(236, 72, 153, 0.3));
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
  }

  /* باکس هشدار/نکته */
  .note {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: right;
    padding: 16px 18px;
    margin-bottom: 32px;
    background: rgba(236, 72, 153, 0.08);
    border: 1px solid rgba(236, 72, 153, 0.25);
    border-right: 4px solid var(--accent);
    border-radius: 14px;
    color: rgba(255, 255, 255, 0.88);
    font-size: 14px;
    line-height: 1.9;
    font-weight: 500;
  }

  .note-icon {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 4px;
    fill: var(--accent);
  }

  /* دکمه */
  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 32px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    background-size: 200% 200%;
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.35s ease,
                background-position 0.6s ease;
    box-shadow: 
      0 12px 30px rgba(99, 102, 241, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.15) inset;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transition: left 0.7s ease;
  }

  .btn:hover {
    transform: translateY(-4px);
    background-position: 100% 50%;
    box-shadow: 
      0 20px 45px rgba(236, 72, 153, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.25) inset;
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  .btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
    transition: transform 0.3s ease;
  }

  .btn:hover svg {
    transform: scale(1.15) rotate(-5deg);
  }

  /* ریسپانسیو */
  @media (max-width: 520px) {
    .card { 
      padding: 38px 24px 32px; 
      border-radius: 26px;
    }
    .title { font-size: 22px; }
    .message { font-size: 15px; line-height: 2; }
    .chip { font-size: 14px; padding: 3px 10px; }
    .btn { font-size: 16px; padding: 16px 24px; }
    .icon-wrap { width: 80px; height: 80px; border-radius: 24px; }
    .icon-wrap svg { width: 40px; height: 40px; }
  }
</style>
</head>
<body>

  <!-- حباب‌های نورانی پس‌زمینه -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- کارت اصلی -->
  <main class="card">
    
    <!-- آیکون سپر / امنیت -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
    </div>

    <!-- عنوان -->
    <h1 class="title">تمدید حساب کاربری</h1>
    <p class="subtitle">فرآیند ساده و سریع در چند ثانیه</p>

    <div class="divider"></div>

    <!-- پیام اصلی -->
    <p class="message">
      برای تمدید حساب خود، کافی است با ارسال
      <span class="chip">تیکت به مدیر</span>
      و همراه کردن
      <span class="chip">توکن اختصاصی</span>
      خود، درخواست تمدید را ثبت نمایید.
    </p>

    <!-- نکته مهم -->
    <div class="note">
      <svg class="note-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span>
        لطفاً توکن خود را دقیقاً به همان شکلی که در اختیار دارید ارسال کنید تا فرآیند تمدید بدون وقفه و در کمترین زمان انجام شود.
      </span>
    </div>

    <!-- دکمه پشتیبانی -->
    <a href="https://mozdbaranarshiya.github.io/Support.html"
       target="_blank"
       rel="noopener noreferrer"
       class="btn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
      </svg>
      <span>پشتیبانی</span>
    </a>

  </main>

</body>
</html>
