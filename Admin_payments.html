<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرداختی‌ها</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css">    <script src="/persian-digits.js"></script>
</head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">پرداختی‌ها</h1><p class="admin-page-subtitle">خریدهای فضای اضافه و سرویس‌های زمانی، کد پیگیری بله و استعلام تراکنش.</p></div><div class="portal-actions"><input id="q" class="portal-input" placeholder="کد سفارش/پیگیری/کاربر" data-persian-input><button id="search" class="admin-btn primary">جست‌وجو</button></div></div><div id="status" class="admin-status"></div><div class="portal-tabs"><button class="portal-tab active" data-tab="storage">فضای اضافه</button><button class="portal-tab" data-tab="service">سرویس</button></div><section class="admin-card admin-card-pad"><div id="list" class="admin-loading">در حال دریافت...</div></section></div><script src="/admin.js"></script><script>
(function(){"use strict";let current='storage';const labels={pending:'در انتظار پرداخت',paid:'پرداخت‌شده',failed:'ناموفق',cancelled:'لغوشده'},ful={pending_payment:'در انتظار پرداخت',awaiting_token:'در انتظار ثبت توکن',active:'فعال',expired:'منقضی',revoked:'لغوشده'};
async function inquire(id){try{AdminAPI.status('status','در حال استعلام...','');const url=current==='storage'?'/api/admin/portal/payments/'+id+'/inquire':'/api/admin/portal/service-payments/'+id+'/inquire';const d=await AdminAPI.request(url,{method:'POST',body:'{}'});const b=d.bale||{};AdminAPI.status('status','وضعیت بله: '+(b.status||'-')+' | شناسه: '+(b.id||'-')+' | مبلغ: '+(b.amount||'-'),'success')}catch(e){AdminAPI.status('status',e.message,'error')}}window.inquire=inquire;
async function load(){try{await AdminAPI.init();const query=encodeURIComponent(PersianDigits.value(document.getElementById('q')).trim());const url=current==='storage'?'/api/admin/portal/payments?q='+query:'/api/admin/portal/service-payments?q='+query;const d=await AdminAPI.request(url);const a=d.payments||[];document.getElementById('list').innerHTML=a.length?`<div class="portal-table-wrap"><table class="portal-table"><thead><tr><th>کاربر</th><th>بسته</th><th>مبلغ</th><th>کد سفارش</th><th>کد پیگیری بله</th><th>پرداخت</th>${current==='service'?'<th>فعال‌سازی</th>':''}<th>تاریخ</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${AdminAPI.esc(x.userName||'')}<br><small>${AdminAPI.esc(x.personnelCode||'')}</small></td><td>${current==='service'?`<b>${AdminAPI.esc(x.productLabel||x.planName)}</b><br><small>${AdminAPI.esc(x.purchaseTypeLabel||'')}${x.accountTierLabel?' | '+AdminAPI.esc(x.accountTierLabel):''} | ${AdminAPI.fa(x.durationMonths||0)} ماه${x.customerEmail?' | '+AdminAPI.esc(x.customerEmail):''}</small>`:AdminAPI.esc(x.planName)}</td><td>${AdminAPI.fa(Number(x.payableAmountIrr).toLocaleString('en-US'))} ریال${current==='service'&&x.discountAmountIrr?`<br><small>تخفیف: ${AdminAPI.fa(Number(x.discountAmountIrr).toLocaleString('en-US'))} ریال</small>`:''}</td><td class="admin-code">${AdminAPI.esc(x.orderCode)}</td><td class="admin-code">${AdminAPI.esc(x.trackingCode||'-')}</td><td>${labels[x.status]||x.status}</td>${current==='service'?`<td>${ful[x.fulfillmentStatus]||x.fulfillmentStatus}</td>`:''}<td>${AdminAPI.esc(x.paidAt||x.createdAt||'-')}</td><td>${x.transactionId?`<button class="admin-btn" onclick="inquire(${x.id})">پیگیری</button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="portal-empty">خریدی ثبت نشده است.</div>'}catch(e){AdminAPI.status('status',e.message,'error')}}
document.querySelectorAll('.portal-tab').forEach(b=>b.onclick=()=>{current=b.dataset.tab;document.querySelectorAll('.portal-tab').forEach(x=>x.classList.toggle('active',x===b));load()});document.getElementById('search').onclick=load;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')load()};load();
})();
</script>
</body></html>
