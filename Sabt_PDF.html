<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت فایل PDF</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/portal.css"><style>.wrap{max-width:760px;margin:auto}.grid{display:grid;gap:12px}.demo{display:none;padding:14px;border:1px solid #fed7aa;background:#fff7ed;border-radius:12px}.demo.show{display:block}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script></head><body><div class="portal-page wrap"><div class="portal-head"><div><h1>ثبت فایل PDF</h1><p>برای فایل می‌توانید رمز دسترسی اختیاری تعیین کنید.</p></div></div><div id="demo" class="demo"><b>حساب آزمایشی:</b> امکان آپلود ندارد.</div><div id="status" class="portal-status"></div><form id="form" class="portal-card grid"><input id="title" class="portal-input" maxlength="120" placeholder="عنوان اختیاری (برای آپلود یک فایل)"><input id="files" type="file" accept=".pdf,application/pdf" multiple required><input id="filePassword" class="portal-input" type="password" maxlength="128" placeholder="رمز فایل اختیاری؛ حداقل ۶ کاراکتر"><input id="filePasswordAgain" class="portal-input" type="password" maxlength="128" placeholder="تکرار رمز فایل"><p>اگر چند PDF را هم‌زمان انتخاب کنید، همین رمز روی همه فایل‌های این نوبت اعمال می‌شود.</p><div class="portal-actions"><button id="submit" class="portal-btn primary" type="submit">ثبت فایل‌ها</button><a class="portal-btn" href="/PDF.html">مشاهده PDFها</a></div></form></div><script src="/portal.js"></script><script>
(function(){"use strict";const $=x=>document.getElementById(x);let demo=false;$("form").onsubmit=async ev=>{ev.preventDefault();if(demo)return;const fs=Array.from($("files").files||[]),pw=$("filePassword").value,pw2=$("filePasswordAgain").value;if(!fs.length){PortalAPI.status("status","حداقل یک PDF انتخاب کنید.","error");return}if(fs.length>20){PortalAPI.status("status","حداکثر ۲۰ فایل در هر بار قابل ثبت است.","error");return}if(pw&&pw.length<6){PortalAPI.status("status","رمز فایل باید حداقل ۶ کاراکتر باشد.","error");return}if(pw!==pw2){PortalAPI.status("status","رمز فایل و تکرار آن یکسان نیست.","error");return}const fd=new FormData();if($("title").value.trim())fd.append("title",$("title").value.trim());if(pw){fd.append("filePassword",pw);fd.append("filePasswordAgain",pw2)}fs.forEach(f=>fd.append("files",f));$("submit").disabled=true;try{const r=await PortalAPI.request("/api/pdfs",{method:"POST",body:fd});PortalAPI.status("status",r.message,"success");ev.target.reset();setTimeout(()=>location.href="/PDF.html",700)}catch(e){PortalAPI.status("status",e.message,"error")}finally{$("submit").disabled=false}};(async()=>{try{const s=await PortalAPI.init();demo=!!s.isDemo;if(demo){$("demo").classList.add("show");$("form").querySelectorAll("input,button").forEach(x=>x.disabled=true)}}catch(e){PortalAPI.status("status",e.message,"error")}})();})();
</script></body></html>
