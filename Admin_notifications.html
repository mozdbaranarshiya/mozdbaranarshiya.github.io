<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اعلانات</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css">    <script src="/persian-digits.js"></script>
  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
</head><body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">اعلانات سامانه</h1><p class="admin-page-subtitle">اعلان را در سامانه ثبت کنید و در صورت نیاز با دکمه جداگانه در گروه بله منتشر کنید.</p></div></div><div id="status" class="admin-status"></div><section class="admin-card admin-card-pad"><div class="portal-form"><div><label>عنوان</label><input id="title" class="portal-input" maxlength="180"></div><div><label>متن</label><textarea id="body" class="portal-textarea"></textarea></div></div><button id="save" class="admin-btn primary" style="margin-top:12px">ثبت اعلان</button></section><section class="admin-card admin-card-pad"><div id="list" class="admin-loading">در حال دریافت...</div></section></div><script src="/admin.js"></script><script>
async function bale(id){try{const d=await AdminAPI.request('/api/admin/portal/notifications/'+id+'/bale',{method:'POST',body:'{}'});AdminAPI.status('status',d.message,'success');load()}catch(e){AdminAPI.status('status',e.message,'error')}}async function toggle(id,a){try{await AdminAPI.request('/api/admin/portal/notifications/'+id+'/active',{method:'PATCH',body:JSON.stringify({active:!a})});load()}catch(e){AdminAPI.status('status',e.message,'error')}}
async function load(){try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/portal/notifications');const a=d.notifications||[];list.innerHTML=a.length?a.map(x=>`<article class="portal-card portal-notice"><h3>${AdminAPI.esc(x.title)}</h3><p>${AdminAPI.esc(x.body)}</p><div class="portal-muted" style="margin:8px 0">${AdminAPI.esc(x.createdAt||'')} ${x.baleSentAt?'| ارسال در بله: '+AdminAPI.esc(x.baleSentAt):''}</div><div class="portal-actions"><button class="admin-btn primary" onclick="bale(${x.id})">اطلاع‌رسانی در پیام‌رسان</button><button class="admin-btn" onclick="toggle(${x.id},${x.active})">${x.active?'پنهان کردن':'نمایش در سامانه'}</button></div></article>`).join(''):'<div class="portal-empty">اعلانی ثبت نشده است.</div>'}catch(e){AdminAPI.status('status',e.message,'error')}}save.onclick=async()=>{try{const d=await AdminAPI.request('/api/admin/portal/notifications',{method:'POST',body:JSON.stringify({title:title.value,body:body.value})});AdminAPI.status('status',d.message,'success');title.value='';body.value='';load()}catch(e){AdminAPI.status('status',e.message,'error')}};load();
</script>
</body></html>
