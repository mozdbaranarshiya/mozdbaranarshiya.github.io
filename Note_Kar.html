<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>یادداشت‌ها</title><link rel="stylesheet" href="/portal.css">
<style>.notes-layout{display:grid;grid-template-columns:320px 1fr;gap:12px}.note-item{padding:10px;border:1px solid #e4e8f0;border-radius:11px;background:#fff;cursor:pointer}.note-item.active{border-color:#2563eb;background:#eff6ff}.note-title{font-weight:800}.note-body-preview{color:#70798e;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.note-editor textarea{min-height:300px}.note-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}@media(max-width:760px){.notes-layout{grid-template-columns:1fr}.note-list{max-height:260px}}</style>
    <script src="/persian-digits.js"></script>
  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
</head>
<body><div class="portal-page"><div class="portal-head"><div><h1>یادداشت‌ها</h1><p>ایجاد، ویرایش، سنجاق، آرشیو و جست‌وجوی یادداشت‌ها.</p></div></div><div id="status" class="portal-status"></div><div id="demoNotice" class="portal-status" style="display:none"></div><div class="note-toolbar"><input id="search" class="portal-input" style="max-width:260px" placeholder="جست‌وجوی یادداشت"><button id="newBtn" class="portal-btn primary">یادداشت جدید</button><button id="archiveToggle" class="portal-btn">نمایش آرشیو</button></div><div class="notes-layout"><section class="portal-card"><div id="list" class="note-list"><div class="portal-empty">در حال دریافت...</div></div></section><section class="portal-card note-editor"><input id="title" class="portal-input" maxlength="200" placeholder="عنوان"><textarea id="body" class="portal-textarea" maxlength="20000" placeholder="متن یادداشت"></textarea><div class="portal-actions" style="margin-top:10px"><button id="save" class="portal-btn primary">ذخیره</button><button id="pin" class="portal-btn">سنجاق</button><button id="archive" class="portal-btn">آرشیو</button><button id="remove" class="portal-btn danger">حذف</button></div></section></div></div>
<script src="/portal.js"></script><script>
(function(){"use strict";let notes=[],selected=null,archived=false,isDemo=false;const $=id=>document.getElementById(id);
function render(){const q=$('search').value.trim().toLowerCase();const arr=notes.filter(n=>!q||(n.title||'').toLowerCase().includes(q)||(n.body||'').toLowerCase().includes(q));$('list').innerHTML=arr.length?arr.map(n=>`<div class="note-item ${selected&&selected.id===n.id?'active':''}" data-id="${n.id}"><div class="note-title">${n.isPinned?'📌 ':''}${PortalAPI.esc(n.title||'بدون عنوان')}</div><div class="note-body-preview">${PortalAPI.esc(n.body||'')}</div><div class="portal-muted">${PortalAPI.date(n.updatedAt)}</div></div>`).join(''):'<div class="portal-empty">یادداشتی وجود ندارد.</div>';document.querySelectorAll('.note-item').forEach(el=>{el.onclick=()=>select(Number(el.dataset.id));});}
function select(id){selected=notes.find(n=>n.id===id)||null;$('title').value=selected?.title||'';$('body').value=selected?.body||'';$('pin').textContent=selected?.isPinned?'برداشتن سنجاق':'سنجاق';$('archive').textContent=selected?.isArchived?'خروج از آرشیو':'آرشیو';render()}
function fresh(){selected=null;$('title').value='';$('body').value='';$('pin').textContent='سنجاق';$('archive').textContent=archived?'خروج از آرشیو':'آرشیو';render()}
async function load(){const d=await PortalAPI.request('/api/notes?archived='+(archived?'1':'0')+'&q='+encodeURIComponent($('search').value.trim()));notes=d.notes||[];if(selected){selected=notes.find(n=>n.id===selected.id)||null}render()}
$('save').onclick=async()=>{if(isDemo){PortalAPI.status('status','حساب آزمایشی فقط برای مشاهده است.','error');return;}try{const data={title:$('title').value.trim(),body:$('body').value.trim()};let d;if(selected)d=await PortalAPI.request('/api/notes/'+selected.id,{method:'PATCH',body:data});else d=await PortalAPI.request('/api/notes',{method:'POST',body:data});PortalAPI.status('status',d.message,'success');selected=d.note;await load();select(selected.id)}catch(e){PortalAPI.status('status',e.message,'error')}};
$('pin').onclick=async()=>{if(isDemo){PortalAPI.status('status','حساب آزمایشی فقط برای مشاهده است.','error');return;}if(!selected)return;try{const d=await PortalAPI.request('/api/notes/'+selected.id,{method:'PATCH',body:{isPinned:!selected.isPinned}});selected=d.note;await load();select(selected.id)}catch(e){PortalAPI.status('status',e.message,'error')}};
$('archive').onclick=async()=>{if(isDemo){PortalAPI.status('status','حساب آزمایشی فقط برای مشاهده است.','error');return;}if(!selected)return;try{await PortalAPI.request('/api/notes/'+selected.id,{method:'PATCH',body:{isArchived:!selected.isArchived}});fresh();await load()}catch(e){PortalAPI.status('status',e.message,'error')}};
$('remove').onclick=async()=>{if(isDemo){PortalAPI.status('status','حساب آزمایشی فقط برای مشاهده است.','error');return;}if(!selected||!confirm('این یادداشت حذف شود؟'))return;try{await PortalAPI.request('/api/notes/'+selected.id,{method:'DELETE'});fresh();await load()}catch(e){PortalAPI.status('status',e.message,'error')}};
$('newBtn').onclick=()=>{if(isDemo){PortalAPI.status('status','حساب آزمایشی فقط برای مشاهده است.','error');return;}fresh()};$('archiveToggle').onclick=async()=>{archived=!archived;$('archiveToggle').textContent=archived?'نمایش یادداشت‌های فعال':'نمایش آرشیو';fresh();await load()};let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
(async()=>{try{const session=await PortalAPI.init();isDemo=!!session.isDemo;if(isDemo){const n=$('demoNotice');n.style.display='block';n.textContent='حساب آزمایشی فقط برای مشاهده یادداشت‌ها است و امکان ایجاد، ویرایش، سنجاق، آرشیو یا حذف ندارد.';n.className='portal-status info';$('title').disabled=true;$('body').disabled=true;['save','pin','archive','remove','newBtn'].forEach(id=>$(id).disabled=true);}await load()}catch(e){PortalAPI.status('status',e.message,'error')}})();
})();
</script>
</body></html>
