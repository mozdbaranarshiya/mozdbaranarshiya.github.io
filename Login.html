<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به سامانه</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/app.css"><style>
.login-container{width:min(470px,calc(100% - 24px));gap:14px}.login-title{width:100%}.login-title h1{margin:0 0 6px;font-size:28px}.login-title p{margin:0;color:#64748b;font-size:13px;line-height:1.9}.demo{width:100%;padding:15px;border:1px solid #bfdbfe;border-radius:16px;background:linear-gradient(145deg,#eff6ff,#f8fbff);line-height:1.9}.demo button{width:100%;margin-top:10px}.hidden{display:none!important}.notice{width:100%;padding:13px;border:1px solid #fed7aa;border-radius:14px;background:#fff7ed;line-height:1.9}.second{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:16px;background:rgba(248,250,252,.85)}.login-buttons{display:grid;grid-template-columns:1fr 1fr}.login-buttons button{width:100%;min-width:0}.login-buttons #loginBtn{grid-column:1/-1}.password-box,.field{width:100%;max-width:none}.field input,.password-box input{width:100%;max-width:none}@media(max-width:520px){.login-buttons{grid-template-columns:1fr}}
</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script>  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head><body class="login-page"><div class="login-container">
<div class="login-title"><h1>ورود به فضای شخصی</h1><p>با نام کاربری و رمز عبور وارد شوید. تأیید هویت و بازیابی حساب از طریق پیام‌رسان‌های متصل سامانه انجام می‌شود.</p></div>
<div class="demo"><b>حساب آزمایشی عمومی</b><br>برای مشاهده امکانات سامانه می‌توانید وارد حساب آزمایشی فقط‌خواندنی شوید.<button type="button" id="demoAccessBtn">ورود به حساب آزمایشی</button></div>
<div class="field"><input id="username" type="text" maxlength="10" inputmode="numeric" autocomplete="username" placeholder="نام کاربری / کد ملی" data-persian-input></div>
<div class="password-box"><input id="password" type="password" maxlength="128" autocomplete="current-password" placeholder="رمز عبور"><span class="show-password" id="togglePassword">👁</span></div>
<div id="secondBox" class="second hidden"><b>رمز دومرحله‌ای</b><p id="secondHint"></p><input id="secondPassword" type="password" maxlength="128" autocomplete="one-time-code" placeholder="رمز دومرحله‌ای"><button id="secondBtn" type="button">تأیید رمز دومرحله‌ای</button></div>
<div id="verifyNeeded" class="notice hidden">شماره موبایل این حساب هنوز در پیام‌رسان تأیید نشده است.<button id="verifyMessengerBtn" type="button">تأیید شماره</button></div>
<p id="message" aria-live="polite"></p>
<div class="login-buttons"><button id="loginBtn" type="button">ورود</button><button id="mobileLoginBtn" type="button">ورود با شماره موبایل</button><button id="signupBtn" type="button">ثبت‌نام</button><button id="forgotBtn" type="button">فراموشی رمز عبور</button><button id="securityBtn" type="button">امنیت حساب</button><button id="information" type="button">درباره سامانه</button><button id="plansBtn" type="button">سرویس‌ها و پلن‌ها</button></div>
</div><script>
(function(){"use strict";const $=id=>document.getElementById(id),u=$("username"),p=$("password"),m=$("message"),sb=$("secondBox");let challenge="";function show(t,ok){m.textContent=t||"";m.style.color=ok?"#15803d":"#b91c1c"}async function finish(r){if(r.secondPasswordRequired){challenge=r.challengeToken||"";$("secondHint").textContent=r.hint?"راهنما: "+r.hint:"رمز دومرحله‌ای حساب را وارد کنید.";sb.classList.remove("hidden");$("secondPassword").focus();show(r.message||"رمز دومرحله‌ای لازم است.",true);return}if(r.ok){show(r.message||"ورود موفق بود.",true);location.href=r.redirect||"/panel.html";return}show(r.message||"ورود انجام نشد.",false)}async function login(){const personnelCode=PersianDigits.value(u).trim(),password=p.value;$("verifyNeeded").classList.add("hidden");show("در حال بررسی...",true);try{const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({personnelCode,password})});const r=await res.json().catch(()=>({}));if(r.verificationRequired)$("verifyNeeded").classList.remove("hidden");await finish(r)}catch(_){show("ارتباط با سامانه برقرار نشد.",false)}}$("loginBtn").onclick=login;$("secondBtn").onclick=async()=>{try{const res=await fetch("/api/login/second-factor",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({challengeToken:challenge,secondPassword:$("secondPassword").value})});await finish(await res.json().catch(()=>({}))}catch(_){show("ارتباط با سامانه برقرار نشد.",false)}};$("demoAccessBtn").onclick=()=>{u.value="123456789";p.value="123456789";login()};$("mobileLoginBtn").onclick=()=>location.href="/Login_Phonenumber.html";$("signupBtn").onclick=()=>location.href="/SignUp.html";$("forgotBtn").onclick=()=>location.href="/forgotpassword.html";$("securityBtn").onclick=()=>location.href="/Account_Access.html";$("information").onclick=()=>location.href="/information.html";$("plansBtn").onclick=()=>location.href="/Plans.html";$("verifyMessengerBtn").onclick=()=>{const n=PersianDigits.value(u).trim();if(/^\d{10}$/.test(n))sessionStorage.setItem("pendingVerifyNationalId",n);location.href="/Verify_Messenger.html"};$("togglePassword").onclick=()=>p.type=p.type==="password"?"text":"password";})();
</script></body></html>
