<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درخواست‌های سرویس</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css"><style>.service-detail{font-size:12px;line-height:1.9;color:#475569}.token-preview{direction:ltr;text-align:left;max-width:260px;overflow:auto;white-space:nowrap;font-family:Consolas,monospace;font-size:11px}</style><script src="/persian-digits.js"></script></head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">درخواست‌های سرویس</h1><p class="admin-page-subtitle">پس از تأیید پرداخت، سفارش در وضعیت «در انتظار ثبت توکن» قرار می‌گیرد. مدیر باید توکن را ثبت کند تا سفارش فعال شود.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div class="admin-toolbar"><select id="filter" class="admin-select"><option value="all">همه</option><option value="awaiting_token">در انتظار ثبت توکن</option><option value="active">فعال</option><option value="expired">منقضی</option><option value="revoked">لغوشده</option></select></div><div id="list" class="admin-loading">در حال دریافت...</div></div>
<div id="modal" class="admin-modal-backdrop"><div class="admin-modal"><h2 class="admin-modal-title">ثبت توکن سرویس</h2><p class="admin-section-note" id="modalInfo"></p><div class="admin-field"><label>توکن کاربر <b>(الزامی)</b></label><textarea id="token" class="admin-textarea" maxlength="4000" dir="ltr" placeholder="توکن را دقیقاً وارد کنید"></textarea></div><div class="admin-field"><label>یادداشت تحویل برای کاربر (اختیاری)</label><textarea id="note" class="admin-textarea" maxlength="2000"></textarea></div><div class="admin-modal-actions"><button id="close" class="admin-btn">انصراف</button><button id="activate" class="admin-btn success">ثبت توکن و فعال‌سازی</button></div></div></div>
<script src="/admin.js"></script><script>
(function(){"use strict";let selected=null,cache=[];const labels={awaiting_token:'در انتظار ثبت توکن',active:'فعال',expired:'منقضی',revoked:'لغوشده',pending_payment:'در انتظار پرداخت'};
function showModal(id){selected=cache.find(x=>x.id===id);if(!selected)return;document.getElementById('modalInfo').textContent=`${selected.userName||selected.personnelCode} — ${selected.productLabel||selected.planName} — ${selected.purchaseTypeLabel||''} — ${selected.durationMonths||0} ماه — ${selected.orderCode}`;document.getElementById('token').value=selected.entitlement?.serviceToken||'';document.getElementById('note').value=selected.entitlement?.deliveryNote||'';document.getElementById('modal').classList.add('show')}
function hide(){selected=null;document.getElementById('modal').classList.remove('show')}window.openActivation=showModal;
window.openTicket=id=>window.location.href='/Admin_tickets.html?ticketId='+encodeURIComponent(id);
window.revoke=async id=>{if(!confirm('دسترسی این سرویس لغو شود؟'))return;try{await AdminAPI.request('/api/admin/portal/service-activations/'+id+'/revoke',{method:'POST',body:{}});AdminAPI.status('status','دسترسی لغو شد.','success');load()}catch(e){AdminAPI.status('status',e.message,'error')}};
async function load(){try{await AdminAPI.init();const f=document.getElementById('filter').value;const d=await AdminAPI.request('/api/admin/portal/service-activations?status='+encodeURIComponent(f));cache=d.requests||[];document.getElementById('list').innerHTML=cache.length?`<div class="portal-table-wrap"><table class="portal-table"><thead><tr><th>کاربر</th><th>سرویس</th><th>جزئیات سفارش</th><th>پرداخت</th><th>وضعیت</th><th>توکن</th><th>انقضا</th><th>عملیات</th></tr></thead><tbody>${cache.map(x=>`<tr><td>${AdminAPI.esc(x.userName||x.personnelCode)}<br><small>${AdminAPI.esc(x.personnelCode||'')}</small></td><td><b>${AdminAPI.esc(x.productLabel||x.planName)}</b><div class="service-detail">${AdminAPI.esc(x.purchaseTypeLabel||'')}${x.accountTierLabel?'<br>نوع حساب: '+AdminAPI.esc(x.accountTierLabel):''}<br>مدت: ${AdminAPI.fa(x.durationMonths||0)} ماه${x.customerEmail?'<br>ایمیل: '+AdminAPI.esc(x.customerEmail):''}</div></td><td class="service-detail">${AdminAPI.esc(x.orderCode)}<br>مبلغ: ${AdminAPI.fa(Number(x.payableAmountIrr||0).toLocaleString('en-US'))} ریال</td><td>${AdminAPI.formatDate(x.paidAt)}</td><td><span class="admin-badge ${x.fulfillmentStatus==='active'?'green':x.fulfillmentStatus==='awaiting_token'?'amber':x.fulfillmentStatus==='revoked'?'red':'gray'}">${AdminAPI.esc(labels[x.fulfillmentStatus]||x.fulfillmentStatus)}</span></td><td>${x.entitlement?.serviceToken?`<div class="token-preview">${AdminAPI.esc(x.entitlement.serviceToken)}</div>`:'-'}</td><td>${x.entitlement?AdminAPI.formatDate(x.entitlement.expiresAt):'-'}</td><td>${x.ticketId?`<button class="admin-btn" onclick="openTicket(${x.ticketId})">پیام در تیکت</button> `:''}${x.fulfillmentStatus==='awaiting_token'?`<button class="admin-btn success" onclick="openActivation(${x.id})">ثبت توکن</button>`:''}${x.fulfillmentStatus==='active'?` <button class="admin-btn danger" onclick="revoke(${x.id})">لغو دسترسی</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="admin-empty">درخواستی در این وضعیت وجود ندارد.</div>'}catch(e){AdminAPI.status('status',e.message,'error')}}
document.getElementById('refresh').onclick=load;document.getElementById('filter').onchange=load;document.getElementById('close').onclick=hide;document.getElementById('activate').onclick=async()=>{if(!selected)return;const token=document.getElementById('token').value.trim();if(!token){AdminAPI.status('status','توکن کاربر را وارد کنید.','error');return}try{const d=await AdminAPI.request('/api/admin/portal/service-activations/'+selected.id+'/activate',{method:'POST',body:{token,deliveryNote:document.getElementById('note').value.trim()}});AdminAPI.status('status',d.message,'success');hide();load()}catch(e){AdminAPI.status('status',e.message,'error')}};load();
})();</script></body></html>
