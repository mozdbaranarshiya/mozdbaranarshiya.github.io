<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت</title>
    <link rel="icon" type="image/png" href="/personalspace-icon.png">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/admin.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .admin-shell {
            width: 100%;
            height: 100vh;
            display: flex;
            direction: ltr;
            overflow: hidden;
        }

        .admin-content {
            order: 1;
            flex: 1;
            min-width: 0;
            height: 100vh;
            padding: 0;
            overflow: hidden;
            direction: rtl;
        }

        #adminFrame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: transparent;
        }

        .admin-brand {
            direction: rtl;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 16px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .admin-brand img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: cover;
        }

        .admin-brand strong {
            display: block;
            color: var(--text-strong);
            font-size: 15px;
            font-weight: 800;
        }

        .admin-brand span {
            display: block;
            margin-top: 3px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .admin-profile .name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-strong);
        }

        .admin-profile .meta {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-nav-group {
            margin: 16px 8px 6px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
        }

        .admin-personal-card {
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(248, 250, 252, 0.8);
        }

        .admin-personal-card .title {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-strong);
        }

        .admin-personal-card .bar {
            height: 7px;
            margin: 9px 0;
            overflow: hidden;
            border-radius: 999px;
            background: #e8eef6;
        }

        .admin-personal-card .bar span {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(
                90deg,
                #2563eb,
                #38bdf8
            );
        }

        .admin-personal-card .stats {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-muted);
            font-size: 10px;
        }

        .admin-personal-note {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 9px;
            line-height: 1.8;
        }

        @media (max-width: 720px) {
            .admin-brand,
            .admin-profile,
            .admin-personal-card,
            .admin-nav-group {
                display: none;
            }

            .admin-nav {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>
<div class="admin-shell">
    <main class="admin-content">
        <iframe id="adminFrame" src="/Admin_dashboard.html" title="بخش مدیریت"></iframe>
    </main>

    <aside class="right-menu">
        <div class="admin-brand">
            <img src="/images.png" alt="">
            <div>
                <strong>پنل مدیریت</strong>
                <span>مدیریت سامانه فضای شخصی</span>
            </div>
        </div>

        <div class="admin-profile user-name">
            <div class="name" id="managerName">در حال بررسی...</div>
            <div class="meta" id="managerMeta">manager</div>
        </div>

        <div class="admin-nav">
            <button class="active" data-page="/Admin_dashboard.html">داشبورد مدیریت</button>
        </div>

        <div class="admin-nav-group">فضای شخصی مدیر</div>
        <div class="admin-nav">
            <button id="personalPanelBtn">ورود به پنل شخصی من</button>
        </div>

        <div class="admin-personal-card">
            <div class="title">فضای شخصی این مدیر</div>
            <div class="bar"><span id="personalStorageBar"></span></div>
            <div class="stats">
                <span id="personalUsed">استفاده‌شده: -</span>
                <span id="personalRemain">باقی‌مانده: -</span>
            </div>
            
        </div>

        <div class="admin-nav-group">کاربران و دسترسی</div>
        <div class="admin-nav">
            <button data-page="/Admin_users.html">مدیریت کاربران</button>
            <button data-page="/Admin_users.html?role=manager">مدیران سیستم</button>
        </div>

        <div class="admin-nav-group">فضای ذخیره‌سازی</div>
        <div class="admin-nav">
            <button data-page="/Admin_storage.html">گزارش Storage</button>
            <button data-page="/Admin_files.html">مدیریت فراداده فایل‌ها</button>
            <button data-page="/Admin_files.html?status=trash">سطل زباله سیستم</button>
        </div>

        <div class="admin-nav-group">مالی و پلن‌ها</div>
        <div class="admin-nav">
            <button data-page="/Admin_plans.html">پلن‌ها و سرویس‌ها</button><button data-page="/Admin_learning.html">مرکز آموزش</button>
            <button id="serviceRequestsBtn" data-page="/Admin_service_requests.html">درخواست‌های سرویس</button>
            <button data-page="/Admin_discounts.html">کدهای تخفیف</button>
            <button data-page="/Admin_payments.html">پرداختی‌های فضای اضافه</button>
        </div>

        <div class="admin-nav-group">پشتیبانی و تنظیمات</div>
        <div class="admin-nav">
            <button data-page="/Admin_tickets.html">تیکت‌ها</button>
            <button data-page="/Admin_notifications.html">اعلانات</button>
            <button data-page="/information.html">بیشتر بدانیم و آموزش‌ها</button>
            <button data-page="/Admin_settings.html">تنظیمات سیستم</button>
        </div>

        <div class="admin-nav-group">گزارش و امنیت</div>
        <div class="admin-nav">
            <button data-page="/Admin_reports.html">گزارش‌ها</button>
            <button data-page="/Admin_audit.html">گزارش فعالیت مدیران</button>
            <button data-page="/Admin_integrations.html">ربات‌ها و ایمیل</button>
            <button data-page="/Admin_health.html">سلامت سیستم</button>
            <button id="logoutBtn" class="danger">خروج</button>
        </div>
    </aside>
</div>

<script src="/admin.js"></script>
<script>
(async function(){
    try {
        await AdminAPI.init();
        const info = await AdminAPI.request('/api/admin/me');
        document.getElementById('managerName').textContent = info.manager.fullName;
        document.getElementById('managerMeta').textContent = info.manager.phone || info.manager.personnelCode;
        const q = info.quota || {};
        const total = Number(q.quotaBytes || 0);
        const used = Number(q.usedBytes || 0);
        const remain = Number(q.remainingBytes || 0);
        const pct = total > 0 ? Math.min(100, used / total * 100) : 0;
        document.getElementById('personalStorageBar').style.width = pct + '%';
        document.getElementById('personalUsed').textContent = 'استفاده‌شده: ' + AdminAPI.formatBytes(used);
        document.getElementById('personalRemain').textContent = 'باقی‌مانده: ' + AdminAPI.formatBytes(remain);
        try {
            const dashboard = await AdminAPI.request('/api/admin/dashboard');
            const pending = Number((dashboard.business || {}).pendingServiceActivations || 0);
            const serviceBtn = document.getElementById('serviceRequestsBtn');
            if (serviceBtn) {
                serviceBtn.textContent = pending > 0
                    ? 'درخواست‌های سرویس (' + AdminAPI.fa(pending) + ')'
                    : 'درخواست‌های سرویس';
            }
        } catch (_) {}
    } catch (e) { console.error(e); }
})();

const frame = document.getElementById('adminFrame');
document.querySelectorAll('[data-page]').forEach(function(btn){
    btn.addEventListener('click', function(){
        document.querySelectorAll('[data-page]').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.page;
    });
});

document.getElementById('personalPanelBtn').addEventListener('click', function(){
    window.location.href = '/panel.html';
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
    try {
        await AdminAPI.request('/api/logout', { method:'DELETE' });
    } catch (_) {}
    window.location.replace('/Login.html');
});
</script>
</body>
</html>
