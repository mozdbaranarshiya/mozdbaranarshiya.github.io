<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی رمز عبور</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/app.css"><style>html{overflow-y:auto}.card{width:min(520px,100%);margin:40px auto;padding:28px;border:1px solid #e2e8f0;border-radius:24px;background:#fff}.grid{display:grid;gap:12px}.hidden{display:none!important}select,input{width:100%}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script></head><body><main class="card"><h1>بازیابی رمز عبور</h1><p>روش دریافت کد را انتخاب کنید: پیامک، ایمیل تأییدشده یا پیام‌رسان تأییدشده.</p><div class="grid"><select id="channel"><option value="sms">پیامک به شماره موبایل</option><option value="email">ایمیل تأییدشده</option><option value="messenger">پیام‌رسان تأییدشده</option></select><input id="personnel" inputmode="numeric" maxlength="10" placeholder="کد ملی" data-persian-input><input id="phone" inputmode="numeric" maxlength="11" placeholder="شماره موبایل" data-persian-input><input id="email" type="email" maxlength="254" placeholder="ایمیل تأییدشده"><button id="send">ارسال کد بازیابی</button><section id="verifyBox" class="grid hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی" data-persian-input><input id="password" type="password" placeholder="رمز جدید؛ حداقل ۱۲ کاراکتر با حرف و عدد"><input id="again" type="password" placeholder="تکرار رمز جدید"><button id="verify">ثبت رمز جدید</button></section><p id="message"></p><button id="back">بازگشت به ورود</button></div></main><script>
(function(){"use strict";const $=x=>document.getElementById(x),ascii=v=>String(v||"").replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));function msg(t,ok){$("message").textContent=t;$("message").style.color=ok?"green":"#b91c1c"}function payload(){return{personnelCode:ascii($("personnel").value).replace(/\D/g,""),phone:ascii($("phone").value).replace(/\D/g,""),email:$("email").value.trim()}}async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||"درخواست انجام نشد.");return d}$("send").onclick=async()=>{const c=$("channel").value,p=payload();let url=c==="sms"?"/api/forgot/sms/start":c==="email"?"/api/forgot/email/start":"/api/forgot/start";try{const d=await call(url,p);$("verifyBox").classList.remove("hidden");msg(d.message,true)}catch(e){msg(e.message,false)}};$("verify").onclick=async()=>{const c=$("channel").value,p=payload();p.code=ascii($("code").value).replace(/\D/g,"");p.newPassword=$("password").value;p.newPasswordAgain=$("again").value;let url=c==="sms"?"/api/forgot/sms/verify":c==="email"?"/api/forgot/email/verify":"/api/forgot/verify";try{const d=await call(url,p);msg(d.message,true);setTimeout(()=>location.replace("/Login.html"),800)}catch(e){msg(e.message,false)}};$("back").onclick=()=>location.replace("/Login.html");})();
</script></body></html>
