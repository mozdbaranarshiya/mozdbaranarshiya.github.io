<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازیابی رمز عبور</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/app.css"><style>html{overflow-y:auto}.recovery-card{width:min(540px,calc(100% - 24px));margin:40px auto;padding:28px}.grid{display:grid;gap:12px}.hidden{display:none!important}.lead{color:#64748b;line-height:1.9}.channel-note{padding:12px 14px;border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff;color:#1e40af;font-size:13px;line-height:1.9}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script>  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head><body><main class="app-card recovery-card"><h1>بازیابی رمز عبور</h1><p class="lead">کد بازیابی فقط از طریق پیام‌رسان تأییدشده حساب شما (بله یا سروش+) ارسال می‌شود.</p><div class="channel-note">شماره موبایل باید همان شماره ثبت‌شده و تأییدشده حساب باشد.</div><div class="grid"><input id="personnel" inputmode="numeric" maxlength="10" placeholder="کد ملی" data-persian-input><input id="phone" inputmode="numeric" maxlength="11" placeholder="شماره موبایل" data-persian-input><button id="send">ارسال کد در پیام‌رسان</button><section id="verifyBox" class="grid hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی" data-persian-input><input id="password" type="password" placeholder="رمز جدید؛ حداقل ۱۲ کاراکتر با حرف و عدد"><input id="again" type="password" placeholder="تکرار رمز جدید"><button id="verify">ثبت رمز جدید</button></section><p id="message"></p><button id="back">بازگشت به ورود</button></div></main><script>
(function(){"use strict";const $=x=>document.getElementById(x),ascii=v=>String(v||"").replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));function msg(t,ok){$("message").textContent=t;$("message").style.color=ok?"#15803d":"#b91c1c"}function payload(){return{personnelCode:ascii($("personnel").value).replace(/\D/g,""),phone:ascii($("phone").value).replace(/\D/g,"")}}async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||"درخواست انجام نشد.");return d}$("send").onclick=async()=>{try{const d=await call("/api/forgot/start",payload());$("verifyBox").classList.remove("hidden");msg(d.message,true)}catch(e){msg(e.message,false)}};$("verify").onclick=async()=>{const p=payload();p.code=ascii($("code").value).replace(/\D/g,"");p.newPassword=$("password").value;p.newPasswordAgain=$("again").value;try{const d=await call("/api/forgot/verify",p);msg(d.message,true);setTimeout(()=>location.replace("/Login.html"),800)}catch(e){msg(e.message,false)}};$("back").onclick=()=>location.replace("/Login.html");})();
</script></body></html>
