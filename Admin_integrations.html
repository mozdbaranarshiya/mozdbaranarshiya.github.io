<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیام‌رسان‌ها</title>
    <link rel="icon" type="image/png" href="/personalspace-icon.png"><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css"><script src="/persian-digits.js"></script><script src="/site-config.js"></script><script src="/api-bridge.js"></script>  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head><body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">پیام‌رسان‌ها و یکپارچه‌سازی</h1><p class="admin-page-subtitle">وضعیت اتصال بله و سروش+ را مشاهده کنید. هیچ Token یا Secret در این صفحه نمایش داده نمی‌شود.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div id="bots" class="admin-grid two"></div><section class="admin-card admin-card-pad" style="margin-top:14px"><h2 class="admin-section-title">راهنمای امنیت</h2><p class="admin-section-note">کلیدها و Tokenهای پیام‌رسان فقط باید در فایل Environment خصوصی Backend نگهداری شوند و نباید در HTML یا مخزن عمومی قرار بگیرند.</p></section></div><script src="/admin.js"></script><script>(function(){"use strict";const $=x=>document.getElementById(x);function esc(x){return AdminAPI.esc(x==null?"-":x)}function botCard(b){return '<section class="admin-card admin-card-pad"><h2 class="admin-section-title">'+esc(b.label)+'</h2><p><span class="admin-badge '+(b.active?"green":"red")+'">'+(b.active?"متصل":"نیاز به بررسی")+'</span></p><div class="admin-kv"><div>تنظیم شده</div><div>'+(b.configured?"بله":"خیر")+'</div><div>نام ربات</div><div>'+esc(b.botName||b.username||"-")+'</div><div>پیام</div><div>'+esc(b.message||"-")+'</div></div></section>'}async function load(){try{await AdminAPI.init();const b=await AdminAPI.request("/api/admin/bot-status");$("bots").innerHTML=(b.bots||[]).map(botCard).join("")||'<div class="admin-empty">وضعیتی دریافت نشد.</div>';AdminAPI.status("status","وضعیت پیام‌رسان‌ها به‌روزرسانی شد.","success")}catch(err){AdminAPI.status("status",err.message,"error")}}$("refresh").onclick=load;load()})();</script></body></html>
