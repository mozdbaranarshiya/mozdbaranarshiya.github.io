<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربات‌ها و ایمیل</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css"><script src="/persian-digits.js"></script>  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
</head><body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">ربات‌ها و سرویس ایمیل</h1><p class="admin-page-subtitle">وضعیت زنده بله، سروش+ و سهمیه داخلی ارسال ایمیل؛ هیچ Token یا Secret نمایش داده نمی‌شود.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div id="bots" class="admin-grid two"></div><section class="admin-card admin-card-pad" style="margin-top:14px"><h2 class="admin-section-title">Resend / سهمیه ایمیل</h2><div id="emailInfo" class="admin-kv"></div><div class="portal-form two" style="margin-top:14px"><label>سقف روزانه<input id="daily" class="portal-input" type="number" min="1"></label><label>سقف ماهانه<input id="monthly" class="portal-input" type="number" min="1"></label><label>افزایش دستی این ماه<input id="bonus" class="portal-input" type="number" min="0"></label></div><button id="save" class="admin-btn primary" style="margin-top:10px">ذخیره سهمیه داخلی</button><p class="admin-section-note">افزایش دستی فقط محدودیت داخلی سامانه را تغییر می‌دهد و سهمیه واقعی Resend را افزایش نمی‌دهد.</p></section></div><script src="/admin.js"></script><script>
(function(){"use strict";const $=x=>document.getElementById(x);function esc(x){return AdminAPI.esc(x==null?"-":x)}function botCard(b){return `<section class="admin-card admin-card-pad"><h2 class="admin-section-title">${esc(b.label)}</h2><p><span class="admin-badge ${b.active?'green':'red'}">${b.active?'متصل':'نیاز به بررسی'}</span></p><div class="admin-kv"><div>تنظیم شده</div><div>${b.configured?'بله':'خیر'}</div><div>نام ربات</div><div>${esc(b.botName||b.username||'-')}</div><div>پیام</div><div>${esc(b.message||'-')}</div></div></section>`}async function load(){try{await AdminAPI.init();const [b,e]=await Promise.all([AdminAPI.request('/api/admin/bot-status'),AdminAPI.request('/api/admin/email/status')]);$("bots").innerHTML=(b.bots||[]).map(botCard).join('')||'<div class="admin-empty">وضعیتی دریافت نشد.</div>';$("emailInfo").innerHTML=`<div>Resend تنظیم شده</div><div>${e.configured?'بله':'خیر'}</div><div>فرستنده</div><div>${esc(e.fromEmail||'-')}</div><div>ارسال امروز</div><div>${AdminAPI.fa(e.usedToday||0)}</div><div>باقی‌مانده امروز</div><div>${AdminAPI.fa(e.remainingToday||0)}</div><div>ارسال این ماه</div><div>${AdminAPI.fa(e.usedThisMonth||0)}</div><div>باقی‌مانده این ماه</div><div>${AdminAPI.fa(e.remainingThisMonth||0)}</div>`;$("daily").value=e.dailyQuota||100;$("monthly").value=e.monthlyQuota||3000;$("bonus").value=e.monthlyBonus||0;AdminAPI.status('status','وضعیت سرویس‌ها به‌روزرسانی شد.','success')}catch(err){AdminAPI.status('status',err.message,'error')}}$("refresh").onclick=load;$("save").onclick=async()=>{try{const r=await AdminAPI.request('/api/admin/email/quota',{method:'PATCH',body:{dailyQuota:Number($("daily").value),monthlyQuota:Number($("monthly").value),monthlyBonus:Number($("bonus").value)}});AdminAPI.status('status',r.message,'success');load()}catch(e){AdminAPI.status('status',e.message,'error')}};load()})();
</script></body></html>
