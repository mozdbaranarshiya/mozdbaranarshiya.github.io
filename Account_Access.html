<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت امنیت حساب</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/portal.css"><style>.wrap{max-width:660px;margin:auto}.grid{display:grid;gap:12px}.danger{border-color:#fecaca;background:#fff1f2}.hidden{display:none!important}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script></head><body><div class="portal-page wrap"><div class="portal-head"><div><h1>مدیریت امنیت حساب</h1><p>ورود با شماره موبایل و کد پیام‌رسان؛ بدون نیاز به نام کاربری و رمز اصلی.</p></div></div><div id="status" class="portal-status"></div><section id="startCard" class="portal-card grid"><input id="phone" class="portal-input" inputmode="numeric" maxlength="11" placeholder="شماره موبایل" data-persian-input><select id="provider" class="portal-input"><option value="bale">بله</option><option value="soroush">سروش+</option></select><button id="send" class="portal-btn primary">ارسال کد تأیید</button><div id="verifyBox" class="grid hidden"><input id="code" class="portal-input" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی" data-persian-input><button id="verify" class="portal-btn primary">تأیید کد</button></div></section><section id="actions" class="portal-card grid hidden"><button id="login" class="portal-btn primary">ورود مستقیم به پنل کاربری</button><button id="remove2" class="portal-btn">حذف رمز دومرحله‌ای</button><div class="portal-card danger"><b>حذف کامل حساب</b><p>این عملیات حساب، نشست‌ها و فایل‌های فضای ذخیره‌سازی را حذف می‌کند و قابل بازگشت نیست.</p><input id="confirm" class="portal-input" placeholder="برای تأیید بنویسید: حذف حساب"><button id="delete" class="portal-btn">حذف کامل حساب</button></div></section></div><script>
(function(){"use strict";const $=x=>document.getElementById(x);let token="";const digits=v=>String(v||"").replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)));async function req(url,opt={}){opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.message||"درخواست انجام نشد.");return d}function msg(t,k){$("status").textContent=t;$("status").className="portal-status "+(k||"")}$("send").onclick=async()=>{try{const phone=digits($("phone").value).replace(/\D/g,"");const d=await req("/api/security/access/start",{method:"POST",body:JSON.stringify({phone,provider:$("provider").value})});$("verifyBox").classList.remove("hidden");msg(d.message,"success")}catch(e){msg(e.message,"error")}};$("verify").onclick=async()=>{try{const phone=digits($("phone").value).replace(/\D/g,"");const code=digits($("code").value).replace(/\D/g,"");const d=await req("/api/security/access/verify",{method:"POST",body:JSON.stringify({phone,provider:$("provider").value,code})});token=d.accessToken;$("actions").classList.remove("hidden");msg("هویت تأیید شد. مجوز امنیتی فقط چند دقیقه اعتبار دارد.","success")}catch(e){msg(e.message,"error")}};$("login").onclick=async()=>{try{const d=await req("/api/security/access/login",{method:"POST",body:JSON.stringify({accessToken:token})});location.href=d.redirect||"/panel.html"}catch(e){msg(e.message,"error")}};$("remove2").onclick=async()=>{try{const d=await req("/api/security/second-password",{method:"DELETE",headers:{"X-Account-Access-Token":token},body:"{}"});msg(d.message,"success")}catch(e){msg(e.message,"error")}};$("delete").onclick=async()=>{if(!confirm("حذف کامل و غیرقابل بازگشت حساب انجام شود؟"))return;try{const d=await req("/api/security/account",{method:"DELETE",headers:{"X-Account-Access-Token":token},body:JSON.stringify({confirmation:$("confirm").value})});msg(d.message,"success");if(d.accountDeleted)setTimeout(()=>location.replace("/Login.html"),900)}catch(e){msg(e.message,"error")}}})();
</script></body></html>
