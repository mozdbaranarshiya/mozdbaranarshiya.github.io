<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش‌های من</title><link rel="stylesheet" href="/portal.css"><style>.orders-grid{display:grid;gap:12px}.order-card{border:1px solid #e4e8f0;border-radius:14px;background:#fff;padding:14px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-head h3{margin:0;font-size:16px}.order-meta{display:grid;grid-template-columns:140px 1fr;gap:7px 10px;margin:12px 0;font-size:12px}.order-meta span{color:#6b7280}.service-token{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px dashed #cbd5e1;background:#f8fafc;border-radius:11px;padding:10px;margin-top:10px}.service-token code{direction:ltr;text-align:left;overflow:auto;white-space:nowrap;font-family:Consolas,monospace;font-size:11px}.awaiting{color:#92400e;font-weight:800}.active-text{color:#166534;font-weight:800}.section-title{margin:20px 0 10px;font-size:17px}@media(max-width:680px){.order-head{display:block}.order-meta{grid-template-columns:1fr}.service-token{grid-template-columns:1fr}.service-token button{width:100%}}</style></head>
<body><div class="portal-page"><div class="portal-head"><div><h1>سفارش‌های من</h1><p>وضعیت خریدهای فضای ذخیره‌سازی و سرویس‌های ChatGPT و توکن تحویل‌شده توسط مدیر را مشاهده کنید.</p></div><button id="refresh" class="portal-btn">به‌روزرسانی</button></div><div id="status" class="portal-status"></div><h2 class="section-title">سفارش‌های سرویس</h2><div id="serviceOrders" class="orders-grid"><div class="portal-empty">در حال دریافت...</div></div><h2 class="section-title">سفارش‌های فضای ذخیره‌سازی</h2><div id="storageOrders" class="orders-grid"><div class="portal-empty">در حال دریافت...</div></div></div>
<script src="/portal.js"></script><script>
(function(){"use strict";const fulfillment={pending_payment:'در انتظار پرداخت',awaiting_token:'در انتظار ثبت توکن',active:'فعال',expired:'منقضی',revoked:'لغوشده'};const pay={pending:'در انتظار پرداخت',paid:'پرداخت‌شده',failed:'ناموفق',cancelled:'لغوشده'};
async function copyToken(value){try{await navigator.clipboard.writeText(value);PortalAPI.status('status','توکن کپی شد.','success')}catch(_){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();PortalAPI.status('status','توکن کپی شد.','success')}}
window.copyOrderToken=id=>{const el=document.getElementById('token-'+id);if(el)copyToken(el.textContent)};
function renderService(rows){document.getElementById('serviceOrders').innerHTML=rows.length?rows.map(o=>{const e=o.entitlement||{};const token=e.serviceToken||'';return `<article class="order-card"><div class="order-head"><div><h3>${PortalAPI.esc(o.productLabel||o.planName)}</h3><div class="portal-muted">${PortalAPI.esc(o.purchaseTypeLabel||'')}${o.accountTierLabel?' — '+PortalAPI.esc(o.accountTierLabel):''}</div></div><span class="portal-badge ${o.fulfillmentStatus==='active'?'paid':o.fulfillmentStatus==='awaiting_token'?'pending':'failed'}">${PortalAPI.esc(fulfillment[o.fulfillmentStatus]||o.fulfillmentStatus)}</span></div><div class="order-meta"><span>کد سفارش</span><b>${PortalAPI.esc(o.orderCode)}</b><span>مدت</span><b>${PortalAPI.fa(o.durationMonths||0)} ماه</b><span>مبلغ</span><b>${PortalAPI.money(o.payableAmountIrr)}</b><span>وضعیت پرداخت</span><b>${PortalAPI.esc(pay[o.status]||o.status)}</b><span>وضعیت تحویل</span><b class="${o.fulfillmentStatus==='active'?'active-text':o.fulfillmentStatus==='awaiting_token'?'awaiting':''}">${PortalAPI.esc(fulfillment[o.fulfillmentStatus]||o.fulfillmentStatus)}</b><span>فعال‌شده</span><b>${PortalAPI.date(e.activatedAt)}</b><span>تاریخ انقضا</span><b>${PortalAPI.date(e.expiresAt)}</b></div>${o.fulfillmentStatus==='awaiting_token'?'<div class="portal-note">درخواست شما تأیید شده و در انتظار ثبت توکن توسط مدیر است.</div>':''}${token?`<div class="service-token"><span>توکن سرویس</span><code id="token-${o.id}">${PortalAPI.esc(token)}</code><button class="portal-btn primary" onclick="copyOrderToken(${o.id})">کپی</button></div>`:''}${e.deliveryNote?`<div class="portal-note">${PortalAPI.esc(e.deliveryNote)}</div>`:''}${o.ticketId?`<div class="portal-actions"><a class="portal-btn" href="/User_tickets.html?ticketId=${o.ticketId}">مشاهده تیکت سفارش</a></div>`:''}</article>`}).join(''):'<div class="portal-empty">هنوز سفارش سرویس ندارید.</div>'}
function renderStorage(rows){document.getElementById('storageOrders').innerHTML=rows.length?rows.map(o=>`<article class="order-card"><div class="order-head"><h3>${PortalAPI.esc(o.planName)}</h3><span class="portal-badge ${o.status==='paid'?'paid':o.status==='pending'?'pending':'failed'}">${PortalAPI.esc(pay[o.status]||o.status)}</span></div><div class="order-meta"><span>کد سفارش</span><b>${PortalAPI.esc(o.orderCode)}</b><span>مبلغ</span><b>${PortalAPI.money(o.payableAmountIrr)}</b><span>وضعیت</span><b>${PortalAPI.esc(pay[o.status]||o.status)}</b><span>زمان ثبت</span><b>${PortalAPI.date(o.createdAt)}</b><span>زمان پرداخت</span><b>${PortalAPI.date(o.paidAt)}</b></div></article>`).join(''):'<div class="portal-empty">هنوز سفارش فضای ذخیره‌سازی ندارید.</div>'}
async function load(){try{await PortalAPI.init();const [svc,storage]=await Promise.all([PortalAPI.request('/api/portal/service-orders'),PortalAPI.request('/api/portal/plans')]);renderService(svc.orders||[]);renderStorage(storage.orders||[])}catch(e){PortalAPI.status('status',e.message,'error')}}
document.getElementById('refresh').onclick=load;load();})();
</script></body></html>
