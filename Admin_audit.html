<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش فعالیت مدیران</title><link rel="stylesheet" href="/admin.css"></head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">گزارش فعالیت مدیران</h1><p class="admin-page-subtitle">تغییر نقش، وضعیت حساب، خروج اجباری، حذف دائمی، پاک‌سازی و تغییر داده‌های مدیریتی ثبت می‌شوند.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div class="admin-card admin-card-pad"><div id="tableArea" class="admin-loading">در حال دریافت...</div><div class="admin-pagination"><button id="prev" class="admin-btn">قبلی</button><span id="pageInfo">-</span><button id="next" class="admin-btn">بعدی</button></div></div></div>
<script src="/admin.js"></script><script>
let page=1,totalPages=0;async function load(p=1){page=p;try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/audit?page='+page+'&per_page=30');totalPages=d.pagination.totalPages||0;document.getElementById('pageInfo').textContent='صفحه '+AdminAPI.fa(page)+' از '+AdminAPI.fa(totalPages||1);document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages;const rows=d.logs||[];document.getElementById('tableArea').innerHTML=rows.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>مدیر</th><th>عملیات</th><th>هدف</th><th>جزئیات</th><th>IP</th><th>زمان</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${AdminAPI.fa(x.id)}</td><td>${AdminAPI.esc(x.managerName)}</td><td class="admin-code">${AdminAPI.esc(x.action)}</td><td>${AdminAPI.esc((x.targetType||'-')+' '+(x.targetId||''))}</td><td class="wrap admin-code">${AdminAPI.esc(JSON.stringify(x.details||{}))}</td><td class="admin-code">${AdminAPI.esc(x.ipAddress||'-')}</td><td>${AdminAPI.formatDate(x.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="admin-empty">هنوز فعالیت مدیریتی ثبت نشده است.</div>';}catch(e){AdminAPI.status('status',e.message,'error')}}document.getElementById('refresh').onclick=()=>load(page);document.getElementById('prev').onclick=()=>page>1&&load(page-1);document.getElementById('next').onclick=()=>page<totalPages&&load(page+1);load();</script></body></html>
