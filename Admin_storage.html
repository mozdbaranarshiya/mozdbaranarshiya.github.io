<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش Storage</title>
    <link rel="icon" type="image/png" href="/personalspace-icon.png"><link rel="stylesheet" href="/admin.css">  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">گزارش فضای ذخیره‌سازی</h1><p class="admin-page-subtitle">Active + Trash فضای مصرف‌شده است و فقط حذف دائمی ظرفیت را آزاد می‌کند.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div id="stats" class="admin-grid stats"><div class="admin-loading">در حال دریافت...</div></div><div class="admin-grid two" style="margin-top:14px"><section class="admin-card admin-card-pad"><h2 class="admin-section-title">Providerها</h2><div id="providers"></div></section><section class="admin-card admin-card-pad"><h2 class="admin-section-title">کاربران پرمصرف</h2><div id="users"></div></section></div></div>
<script src="/admin.js"></script><script>
function stat(l,v,h){return `<section class="admin-card admin-stat"><div class="admin-stat-label">${l}</div><div class="admin-stat-value">${v}</div><div class="admin-stat-hint">${h||''}</div></section>`}
async function load(){try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/storage?limit=40'),t=d.totals;const pct=t.quotaBytes?Math.min(100,t.usedBytes/t.quotaBytes*100):0;document.getElementById('stats').innerHTML=[stat('جمع سهمیه کاربران',AdminAPI.formatBytes(t.quotaBytes)),stat('مصرف واقعی',AdminAPI.formatBytes(t.usedBytes),'Active + Trash'),stat('فایل‌های فعال',AdminAPI.formatBytes(t.activeBytes)),stat('سطل زباله',AdminAPI.formatBytes(t.trashBytes),'تا حذف دائمی مصرف می‌شود')].join('')+`<section class="admin-card admin-stat" style="grid-column:1/-1"><div class="admin-stat-label">نسبت مصرف به سهمیه تجمیعی</div><div class="admin-progress" style="margin-top:14px"><span style="width:${pct}%"></span></div><div class="admin-stat-hint">${AdminAPI.fa(pct.toFixed(1))}٪ مصرف شده | باقی‌مانده ${AdminAPI.formatBytes(t.remainingBytes)}</div></section>`;
const p=d.providers||[];document.getElementById('providers').innerHTML=p.length?`<div class="admin-table-wrap"><table class="admin-table" style="min-width:0"><thead><tr><th>Provider</th><th>Object</th><th>حجم</th></tr></thead><tbody>${p.map(x=>`<tr><td class="admin-code">${AdminAPI.esc(x.provider)}</td><td>${AdminAPI.fa(x.objects)}</td><td>${AdminAPI.formatBytes(x.sizeBytes)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="admin-empty">داده‌ای وجود ندارد.</div>';
const u=d.users||[];document.getElementById('users').innerHTML=u.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>کاربر</th><th>مصرف</th><th>سهمیه</th><th>Trash</th><th>فایل</th></tr></thead><tbody>${u.map(x=>`<tr><td>${AdminAPI.esc(x.fullName)}<br><small>${AdminAPI.esc(x.personnelCode)}</small></td><td>${AdminAPI.formatBytes(x.usedBytes)}</td><td>${AdminAPI.formatBytes(x.quotaBytes)}</td><td>${AdminAPI.formatBytes(x.trashBytes)}</td><td>${AdminAPI.fa(x.filesCount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="admin-empty">کاربری وجود ندارد.</div>';}catch(e){AdminAPI.status('status',e.message,'error')}}
document.getElementById('refresh').onclick=load;load();</script></body></html>
