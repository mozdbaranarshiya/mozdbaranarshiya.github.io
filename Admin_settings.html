<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تنظیمات سیستم</title><link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/portal.css"><style>.setting-block{margin-top:18px;padding-top:18px;border-top:1px solid #e2e8f0}.seen-chat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid #e2e8f0;border-radius:10px;margin-top:7px}.seen-chat small{color:#64748b}</style><script src="/persian-digits.js"></script>  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">تنظیمات سیستم</h1><p class="admin-page-subtitle">ورود کاربران و مقصد اعلان‌های پیام‌رسان بله را مدیریت کنید.</p></div></div><div id="status" class="admin-status"></div><section class="admin-card admin-card-pad"><label style="display:flex;gap:8px;align-items:center"><input id="enabled" type="checkbox"> ورود کاربران فعال باشد</label><div style="margin-top:14px"><label>پیام هنگام بسته بودن ورود</label><textarea id="message" class="portal-textarea" maxlength="1000"></textarea></div>
<div class="setting-block"><h2 class="admin-section-title">مقصد اعلان‌های بله</h2><p class="admin-section-note">بازو باید داخل گروه یا کانال موردنظر حضور داشته باشد. یک پیام در آن گفت‌وگو ارسال کنید تا شناسه آن در فهرست زیر ظاهر شود؛ سپس شناسه را انتخاب و پیام آزمایشی بفرستید.</p><label>Chat ID مقصد</label><input id="baleChatId" class="portal-input" type="text" inputmode="numeric" data-persian-input placeholder="مثال: -123456789"><div class="portal-actions" style="margin-top:9px"><button id="testBale" type="button" class="admin-btn">ارسال پیام آزمایشی</button></div><div id="seenChats" style="margin-top:12px"></div></div>
<button id="save" class="admin-btn primary" style="margin-top:18px">ذخیره تنظیمات</button></section></div><script src="/admin.js"></script><script>
let chats=[];function renderChats(){seenChats.innerHTML=chats.length?'<b>گفت‌وگوهای دیده‌شده توسط بازو:</b>'+chats.map(c=>`<div class="seen-chat"><div><b>${AdminAPI.esc(c.title||c.username||'بدون عنوان')}</b><br><small>${AdminAPI.esc(c.type)} | ${AdminAPI.esc(c.chatId)} | ${AdminAPI.formatDate(c.lastSeenAt)}</small></div><button class="admin-btn" type="button" onclick="selectChat('${AdminAPI.esc(c.chatId)}')">انتخاب</button></div>`).join(''):'<div class="portal-empty">هنوز گروه/کانالی توسط بازو دیده نشده است.</div>'}window.selectChat=id=>{baleChatId.value=PersianDigits.toPersian(id)};
async function load(){try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/portal/settings');enabled.checked=!!d.loginEnabled;message.value=d.loginDisabledMessage||'';baleChatId.value=PersianDigits.toPersian(d.baleAnnouncementChatId||'');chats=d.baleChats||[];renderChats()}catch(e){AdminAPI.status('status',e.message,'error')}}
save.onclick=async()=>{try{const d=await AdminAPI.request('/api/admin/portal/settings',{method:'PATCH',body:{loginEnabled:enabled.checked,loginDisabledMessage:message.value,baleAnnouncementChatId:PersianDigits.value(baleChatId)}});AdminAPI.status('status',d.message,'success');await load()}catch(e){AdminAPI.status('status',e.message,'error')}};
testBale.onclick=async()=>{try{await AdminAPI.request('/api/admin/portal/settings',{method:'PATCH',body:{loginEnabled:enabled.checked,loginDisabledMessage:message.value,baleAnnouncementChatId:PersianDigits.value(baleChatId)}});const d=await AdminAPI.request('/api/admin/portal/settings/test-bale-announcement',{method:'POST',body:{}});AdminAPI.status('status',d.message,'success')}catch(e){AdminAPI.status('status',e.message,'error')}};load();
</script></body></html>
