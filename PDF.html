<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فایل‌های PDF</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/portal.css"><style>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.item h3{word-break:break-word}.lock{font-size:12px;padding:4px 8px;border-radius:999px;background:#fef3c7}.actions{display:flex;gap:6px;flex-wrap:wrap}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script></head><body><div class="portal-page"><div class="portal-head"><div><h1>فایل‌های PDF</h1><p>دانلود، رمزگذاری و انتقال فایل‌ها به سطل زباله.</p></div><a class="portal-btn primary" href="/Sabt_PDF.html">ثبت PDF جدید</a></div><div id="status" class="portal-status"></div><div id="list" class="grid"></div></div><script src="/portal.js"></script><script>
(function(){"use strict";const $=x=>document.getElementById(x);let demo=false,files=[];async function download(f){let pw="";if(f.passwordProtected){pw=prompt("این فایل رمز دارد. رمز فایل را وارد کنید:")||"";if(!pw)return}try{const h={};if(pw)h["X-File-Password"]=pw;const r=await fetch(f.url,{credentials:"same-origin",headers:h});if(!r.ok){let d={};try{d=await r.json()}catch(_){}throw new Error(d.message||"دانلود انجام نشد.")}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=f.originalName||f.title||"file.pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}catch(e){PortalAPI.status("status",e.message,"error")}}async function setPassword(f){if(demo)return;const action=f.passwordProtected?(confirm("OK = تغییر/تنظیم رمز جدید، Cancel = حذف رمز")?"set":"clear"):"set";let body={action};if(action==="set"){const p=prompt("رمز جدید فایل (حداقل ۶ کاراکتر):")||"";if(!p)return;const p2=prompt("تکرار رمز:")||"";body.password=p;body.passwordAgain=p2}try{const r=await PortalAPI.request("/api/files/"+f.id+"/password",{method:"PATCH",body});PortalAPI.status("status",r.message,"success");load()}catch(e){PortalAPI.status("status",e.message,"error")}}async function remove(f){if(demo)return;if(!confirm("فایل به سطل زباله منتقل شود؟"))return;try{const r=await PortalAPI.request("/api/pdfs/"+f.id,{method:"DELETE"});PortalAPI.status("status",r.message,"success");load()}catch(e){PortalAPI.status("status",e.message,"error")}}function render(){const root=$("list");if(!files.length){root.innerHTML='<div class="portal-empty">فایلی ثبت نشده است.</div>';return}root.innerHTML="";files.forEach(f=>{const el=document.createElement("section");el.className="portal-card item";el.innerHTML=`<h3>${PortalAPI.esc(f.title||f.originalName)}</h3><p>${PortalAPI.esc(f.originalName||"")}</p><p>${f.passwordProtected?'<span class="lock">🔒 رمزدار</span>':'بدون رمز'}</p><div class="actions"></div>`;const ac=el.querySelector(".actions");[["دانلود",()=>download(f)],[f.passwordProtected?"مدیریت رمز":"گذاشتن رمز",()=>setPassword(f)],["سطل زباله",()=>remove(f)]].forEach(([t,fn])=>{const b=document.createElement("button");b.className="portal-btn";b.textContent=t;b.disabled=demo&&t!=="دانلود";b.onclick=fn;ac.appendChild(b)});root.appendChild(el)})}async function load(){const d=await PortalAPI.request("/api/pdfs");files=d.files||[];render()}(async()=>{try{const s=await PortalAPI.init();demo=!!s.isDemo;if(demo)PortalAPI.status("status","حساب آزمایشی فقط برای مشاهده است.","info");await load()}catch(e){PortalAPI.status("status",e.message,"error")}})();})();
</script></body></html>
