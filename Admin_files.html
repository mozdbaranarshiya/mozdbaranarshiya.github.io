<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت فایل‌ها</title><link rel="stylesheet" href="/admin.css">    <script src="/persian-digits.js"></script>
  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 id="title" class="admin-page-title">مدیریت فایل‌ها</h1><p class="admin-page-subtitle">برای رعایت حریم خصوصی، این صفحه فقط فراداده فایل‌ها را نمایش می‌دهد و محتوای خصوصی فایل را باز نمی‌کند.</p></div><button id="cleanup" class="admin-btn danger" style="display:none">پاک‌سازی فایل‌های منقضی</button></div><div id="statusBox" class="admin-status"></div><div class="admin-card admin-card-pad"><div class="admin-toolbar"><input id="q" class="admin-input" placeholder="نام فایل، مالک یا موبایل..." data-persian-input><select id="state" class="admin-select"><option value="all">همه وضعیت‌ها</option><option value="active">فعال</option><option value="trash">Trash</option></select><select id="provider" class="admin-select"><option value="all">همه Providerها</option><option value="arvan_s3">Arvan</option><option value="supabase">Supabase</option><option value="legacy_local">Local Legacy</option></select><button id="search" class="admin-btn primary">جست‌وجو</button></div><div id="tableArea" class="admin-loading">در حال دریافت...</div><div class="admin-pagination"><button id="prev" class="admin-btn">قبلی</button><span id="pageInfo">-</span><button id="next" class="admin-btn">بعدی</button></div></div></div>
<script src="/admin.js"></script><script>
let page=1,totalPages=0;const preset=AdminAPI.qs('status','all');document.getElementById('state').value=preset;if(preset==='trash'){document.getElementById('title').textContent='سطل زباله سیستم';document.getElementById('cleanup').style.display='inline-flex';}
function badge(x){return `<span class="admin-badge ${x.inTrash?'red':'green'}">${x.inTrash?'Trash':'فعال'}</span>`}
async function load(p=1){page=p;try{await AdminAPI.init();const qs=new URLSearchParams({page:String(page),per_page:'25',q:PersianDigits.value(document.getElementById('q')).trim(),status:document.getElementById('state').value,provider:document.getElementById('provider').value});const d=await AdminAPI.request('/api/admin/files?'+qs);totalPages=d.pagination.totalPages||0;document.getElementById('pageInfo').textContent='صفحه '+AdminAPI.fa(page)+' از '+AdminAPI.fa(totalPages||1);document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=totalPages;const rows=d.files||[];document.getElementById('tableArea').innerHTML=rows.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>ID</th><th>فایل</th><th>مالک</th><th>حجم</th><th>Provider</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${AdminAPI.fa(f.id)}</td><td class="wrap"><strong>${AdminAPI.esc(f.name)}</strong><br><small>${AdminAPI.esc(f.fileKind||f.mimeType||'')}</small></td><td>${AdminAPI.esc(f.ownerName)}<br><small>${AdminAPI.esc(f.ownerPhone)}</small></td><td>${AdminAPI.formatBytes(f.sizeBytes)}</td><td class="admin-code">${AdminAPI.esc(f.storageProvider)}</td><td>${badge(f)}</td><td>${AdminAPI.formatDate(f.inTrash?f.deletedAt:f.createdAt)}</td><td>${f.inTrash?`<button class="admin-btn danger" onclick="permanentDelete(${f.id})">حذف دائمی</button>`:'<span class="admin-badge gray">فقط فراداده</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="admin-empty">فایلی پیدا نشد.</div>';}catch(e){AdminAPI.status('statusBox',e.message,'error')}}
async function permanentDelete(id){if(!AdminAPI.confirm('این فایل برای همیشه از Storage و دیتابیس حذف شود؟ این عمل قابل بازگشت نیست.'))return;try{await AdminAPI.request('/api/admin/trash/'+id,{method:'DELETE'});AdminAPI.status('statusBox','فایل برای همیشه حذف شد.','success');load(page)}catch(e){AdminAPI.status('statusBox',e.message,'error')}}
document.getElementById('cleanup').onclick=async()=>{if(!AdminAPI.confirm('فقط فایل‌های Trash که ۳۰ روزشان تمام شده پاک‌سازی شوند؟'))return;try{const d=await AdminAPI.request('/api/admin/trash/cleanup',{method:'POST',body:JSON.stringify({limit:500})});AdminAPI.status('statusBox',d.message,'success');load(1)}catch(e){AdminAPI.status('statusBox',e.message,'error')}};document.getElementById('search').onclick=()=>load(1);document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')load(1)});document.getElementById('prev').onclick=()=>page>1&&load(page-1);document.getElementById('next').onclick=()=>page<totalPages&&load(page+1);load();</script>
</body></html>
