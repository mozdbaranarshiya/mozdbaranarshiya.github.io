<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیام‌ها و فایل‌ها</title><link rel="stylesheet" href="/portal.css"><style>.message-list{display:grid;gap:10px}.message-files{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}</style>    <script src="/persian-digits.js"></script>
</head><body><div class="portal-page"><div class="portal-head"><div><h1>پیام‌ها</h1><p>ثبت پیام شخصی همراه با فایل‌های مجاز.</p></div></div><div id="status" class="portal-status"></div><div id="demoNotice" class="portal-status" style="display:none"></div><section class="portal-card"><textarea id="message" class="portal-textarea" maxlength="10000" placeholder="متن پیام"></textarea><input id="files" class="portal-input" type="file" multiple><div class="portal-actions" style="margin-top:10px"><button id="send" class="portal-btn primary">ذخیره پیام</button></div></section><section class="portal-card"><h2 style="font-size:16px;margin-top:0">پیام‌های اخیر</h2><div id="list" class="message-list"><div class="portal-empty">در حال دریافت...</div></div></section></div><script src="/portal.js"></script><script>
(function(){"use strict";async function load(){const d=await PortalAPI.request('/api/messages');const a=d.messages||[];document.getElementById('list').innerHTML=a.length?a.map(m=>`<article class="portal-message"><div class="meta">${PortalAPI.date(m.createdAt)}</div><div>${PortalAPI.esc(m.body||'').replace(/\n/g,'<br>')}</div>${(m.files||[]).length?`<div class="message-files">${m.files.map(f=>`<a class="portal-btn" href="${PortalAPI.esc(f.downloadUrl)}">${PortalAPI.esc(f.name)}</a>`).join('')}</div>`:''}</article>`).join(''):'<div class="portal-empty">پیامی ثبت نشده است.</div>'}
document.getElementById('send').onclick=async()=>{try{const fd=new FormData();fd.append('message',document.getElementById('message').value);for(const f of document.getElementById('files').files)fd.append('files',f);const d=await PortalAPI.request('/api/messages',{method:'POST',body:fd});PortalAPI.status('status',d.message,'success');document.getElementById('message').value='';document.getElementById('files').value='';await load()}catch(e){PortalAPI.status('status',e.message,'error')}};(async()=>{try{const session=await PortalAPI.init();if(session.isDemo){const n=document.getElementById('demoNotice');n.style.display='block';n.textContent='حساب آزمایشی فقط برای مشاهده است؛ ثبت پیام و فایل غیرفعال است.';n.className='portal-status info';document.getElementById('message').disabled=true;document.getElementById('files').disabled=true;document.getElementById('send').disabled=true;}await load()}catch(e){PortalAPI.status('status',e.message,'error')}})();})();
</script>
</body></html>
