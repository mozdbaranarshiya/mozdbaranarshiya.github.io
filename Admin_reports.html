<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش‌ها</title><link rel="stylesheet" href="/admin.css">  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
</head>
<body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">گزارش‌های مدیریتی</h1><p class="admin-page-subtitle">رشد فایل‌ها، Storage، کاربران و وضعیت سرویس‌های زمانی.</p></div><button id="refresh" class="admin-btn primary">به‌روزرسانی</button></div><div id="status" class="admin-status"></div><div class="admin-grid two"><section class="admin-card admin-card-pad"><h2 class="admin-section-title">آپلود ۱۴ روز اخیر</h2><div id="uploads"></div></section><section class="admin-card admin-card-pad"><h2 class="admin-section-title">Providerها</h2><div id="providers"></div></section><section class="admin-card admin-card-pad"><h2 class="admin-section-title">نقش کاربران</h2><div id="roles"></div></section><section class="admin-card admin-card-pad"><h2 class="admin-section-title">۱۰ کاربر پرمصرف</h2><div id="users"></div></section><section class="admin-card admin-card-pad"><h2 class="admin-section-title">سرویس‌های زمانی</h2><div id="services"></div></section></div></div>
<script src="/admin.js"></script><script>
function simpleTable(headers,rows){return rows.length?`<div class="admin-table-wrap"><table class="admin-table" style="min-width:0"><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="admin-empty">داده‌ای وجود ندارد.</div>'}
async function load(){try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/reports');document.getElementById('uploads').innerHTML=simpleTable(['روز','فایل','حجم'],(d.uploads||[]).map(x=>`<tr><td>${AdminAPI.esc(x.day)}</td><td>${AdminAPI.fa(x.filesCount)}</td><td>${AdminAPI.formatBytes(x.sizeBytes)}</td></tr>`));document.getElementById('providers').innerHTML=simpleTable(['Provider','فایل','حجم'],(d.providers||[]).map(x=>`<tr><td class="admin-code">${AdminAPI.esc(x.provider)}</td><td>${AdminAPI.fa(x.filesCount)}</td><td>${AdminAPI.formatBytes(x.sizeBytes)}</td></tr>`));document.getElementById('roles').innerHTML=simpleTable(['نقش','تعداد'],(d.roles||[]).map(x=>`<tr><td>${AdminAPI.esc(x.role)}</td><td>${AdminAPI.fa(x.count)}</td></tr>`));document.getElementById('users').innerHTML=simpleTable(['کاربر','مصرف'],(d.topUsers||[]).map(x=>`<tr><td>${AdminAPI.esc(x.fullName)}<br><small>${AdminAPI.esc(x.personnelCode)}</small></td><td>${AdminAPI.formatBytes(x.usedBytes)}</td></tr>`));const s=d.services||{};document.getElementById('services').innerHTML=`<div class="admin-kv"><div>کل سفارش‌ها</div><div>${AdminAPI.fa(s.orders||0)}</div><div>پرداخت‌شده</div><div>${AdminAPI.fa(s.paid||0)}</div><div>منتظر فعال‌سازی</div><div>${AdminAPI.fa(s.awaiting||0)}</div><div>فعال</div><div>${AdminAPI.fa(s.active||0)}</div><div>منقضی</div><div>${AdminAPI.fa(s.expired||0)}</div><div>درآمد ثبت‌شده</div><div>${AdminAPI.fa(Number(s.revenueIrr||0).toLocaleString('en-US'))} ریال</div></div>`;}catch(e){AdminAPI.status('status',e.message,'error')}}document.getElementById('refresh').onclick=load;load();</script></body></html>
