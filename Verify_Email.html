<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأیید ایمیل</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/portal.css"><style>.wrap{max-width:650px;margin:auto}.warn{padding:14px;border:1px solid #fed7aa;background:#fff7ed;border-radius:14px;line-height:2}.grid{display:grid;gap:12px}.hidden{display:none!important}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script></head><body><div class="portal-page wrap"><div class="portal-head"><div><h1>ثبت و تأیید ایمیل</h1><p>برای ادامه استفاده از حساب، ایمیل باید تأیید شود.</p></div></div><div id="deadline" class="warn"></div><div id="status" class="portal-status"></div><section class="portal-card grid"><label>ایمیل<input id="email" class="portal-input" type="email" maxlength="254" autocomplete="email" placeholder="name@example.com"></label><div class="portal-actions"><button id="send" class="portal-btn primary">ارسال کد با ایمیل</button><button id="google" class="portal-btn">ورود با گوگل</button></div><div id="codeBox" class="grid hidden"><label>کد تأیید<input id="code" class="portal-input" inputmode="numeric" maxlength="6" data-persian-input></label><button id="verify" class="portal-btn primary">تأیید ایمیل</button></div></section></div><script src="/portal.js"></script><script>
(async function(){"use strict";const $=x=>document.getElementById(x);try{const s=await PortalAPI.init();if(s.isDemo){location.replace("/panel.html");return}const st=await PortalAPI.request("/api/email/status");if(st.verified){location.replace(s.role==="manager"?"/Admin_panel.html":"/panel.html");return}const d=st.daysRemaining==null?"مهلت ۳۰ روزه پس از فعال‌شدن الزام ایمیل محاسبه می‌شود.":`تا حذف خودکار حساب در صورت عدم تأیید: ${st.daysRemaining} روز باقی مانده است.`;$("deadline").textContent=d;$("email").value=st.pendingEmail||st.email||"";$("send").disabled=!st.resendAvailable;$("google").disabled=!st.googleAvailable;$("send").onclick=async()=>{try{const r=await PortalAPI.request("/api/email/send-code",{method:"POST",body:{email:$("email").value.trim(),purpose:"initial"}});$("codeBox").classList.remove("hidden");PortalAPI.status("status",r.message,"success")}catch(e){PortalAPI.status("status",e.message,"error")}};$("verify").onclick=async()=>{try{const r=await PortalAPI.request("/api/email/verify-code",{method:"POST",body:{code:PersianDigits.value($("code")).trim()}});PortalAPI.status("status",r.message,"success");setTimeout(()=>location.replace(r.redirect||"/panel.html"),600)}catch(e){PortalAPI.status("status",e.message,"error")}};$("google").onclick=async()=>{try{const r=await PortalAPI.request("/api/email/google/start?purpose=initial&email="+encodeURIComponent($("email").value.trim()));location.href=r.authorizationUrl}catch(e){PortalAPI.status("status",e.message,"error")}}}catch(e){PortalAPI.status("status",e.message,"error")}})();
</script></body></html>
