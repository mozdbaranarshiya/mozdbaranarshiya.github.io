<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل و امنیت</title><link rel="icon" href="/personalspace-icon.png"><link rel="stylesheet" href="/portal.css"><style>.profile-value{padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.demo-lock{display:none;padding:14px;border:1px solid #fed7aa;background:#fff7ed;border-radius:12px}.demo-lock.show{display:block}.security-card{margin-top:14px}@media(max-width:640px){.two{grid-template-columns:1fr}}</style><script src="./site-config.js"></script><script src="./api-bridge.js"></script><script src="/persian-digits.js"></script></head><body><div class="portal-page"><div class="portal-head"><div><h1>پروفایل و امنیت حساب</h1><p>اطلاعات حساب، ایمیل تأییدشده و رمز دومرحله‌ای.</p></div></div><div id="status" class="portal-status"></div><div id="demoLock" class="demo-lock"><b>حساب آزمایشی:</b> تغییرات امنیتی غیرفعال است.</div><section class="portal-card"><h2>اطلاعات حساب</h2><div class="grid two"><label>نام<div id="firstName" class="profile-value">-</div></label><label>نام خانوادگی<div id="lastName" class="profile-value">-</div></label><label>موبایل<div id="phone" class="profile-value">-</div></label><label>نام کاربری<div id="personnelCode" class="profile-value">-</div></label><label>ایمیل<div id="currentEmail" class="profile-value">-</div></label><label>وضعیت ایمیل<div id="emailState" class="profile-value">-</div></label></div></section><section class="portal-card security-card"><h2>تغییر رمز اصلی</h2><form id="passwordForm" class="grid"><input class="portal-input" id="currentPassword" type="password" placeholder="رمز فعلی"><input class="portal-input" id="newPassword" type="password" placeholder="رمز جدید؛ حداقل ۱۲ کاراکتر با حرف و عدد"><input class="portal-input" id="newPasswordAgain" type="password" placeholder="تکرار رمز جدید"><button class="portal-btn primary" type="submit">ذخیره رمز اصلی</button></form></section><section class="portal-card security-card"><h2>تغییر ایمیل</h2><p>تا زمانی که ایمیل جدید تأیید نشود، ایمیل قبلی حساب حفظ می‌شود.</p><div class="grid"><input id="newEmail" class="portal-input" type="email" placeholder="ایمیل جدید"><div class="portal-actions"><button id="sendEmailCode" class="portal-btn primary">ارسال کد ایمیل</button><button id="googleEmail" class="portal-btn">تأیید با گوگل</button></div><input id="emailCode" class="portal-input" inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی" data-persian-input><button id="verifyEmail" class="portal-btn primary">تأیید ایمیل جدید</button></div></section><section class="portal-card security-card"><h2>رمز دومرحله‌ای اختیاری</h2><p id="secondStatus">در حال بررسی...</p><div class="grid"><input id="secondPassword" class="portal-input" type="password" placeholder="رمز دومرحله‌ای جدید"><input id="secondPasswordAgain" class="portal-input" type="password" placeholder="تکرار رمز دومرحله‌ای"><input id="secondHint" class="portal-input" maxlength="160" placeholder="راهنمای رمز"><button id="saveSecond" class="portal-btn primary">فعال/به‌روزرسانی رمز دومرحله‌ای</button><input id="currentSecond" class="portal-input" type="password" placeholder="رمز دومرحله‌ای فعلی برای غیرفعال‌سازی"><button id="disableSecond" class="portal-btn">غیرفعال‌سازی رمز دومرحله‌ای</button></div><p><a id="accountPortal" class="portal-btn" href="/Account_Access.html">مدیریت امنیت با شماره موبایل</a></p></section></div><script src="/portal.js"></script><script>
(function(){"use strict";const $=x=>document.getElementById(x);let demo=false;const code=()=>PersianDigits.value($("emailCode")).trim();async function reloadSecurity(){const x=await PortalAPI.request("/api/security/settings");$("currentEmail").textContent=x.email||"ثبت نشده";$("emailState").textContent=x.emailVerified?"تأیید شده":"تأیید نشده";$("secondStatus").textContent=x.secondPasswordEnabled?"فعال است"+(x.secondPasswordHint?" — راهنما: "+x.secondPasswordHint:""):"غیرفعال است";$("secondHint").value=x.secondPasswordHint||"";$("accountPortal").href=x.accountPortalUrl||"/Account_Access.html"}$("passwordForm").onsubmit=async ev=>{ev.preventDefault();if(demo)return;try{const r=await PortalAPI.request("/api/profile/password",{method:"PATCH",body:{currentPassword:$("currentPassword").value,newPassword:$("newPassword").value,newPasswordAgain:$("newPasswordAgain").value}});PortalAPI.status("status",r.message,"success");ev.target.reset()}catch(e){PortalAPI.status("status",e.message,"error")}};$("sendEmailCode").onclick=async()=>{if(demo)return;try{const r=await PortalAPI.request("/api/email/send-code",{method:"POST",body:{email:$("newEmail").value.trim(),purpose:"change"}});PortalAPI.status("status",r.message,"success")}catch(e){PortalAPI.status("status",e.message,"error")}};$("verifyEmail").onclick=async()=>{if(demo)return;try{const r=await PortalAPI.request("/api/email/verify-code",{method:"POST",body:{code:code()}});PortalAPI.status("status",r.message,"success");await reloadSecurity()}catch(e){PortalAPI.status("status",e.message,"error")}};$("googleEmail").onclick=async()=>{if(demo)return;try{const r=await PortalAPI.request("/api/email/google/start?purpose=change&email="+encodeURIComponent($("newEmail").value.trim()));location.href=r.authorizationUrl}catch(e){PortalAPI.status("status",e.message,"error")}};$("saveSecond").onclick=async()=>{if(demo)return;try{const r=await PortalAPI.request("/api/security/second-password",{method:"PUT",body:{password:$("secondPassword").value,passwordAgain:$("secondPasswordAgain").value,hint:$("secondHint").value}});PortalAPI.status("status",r.message,"success");$("secondPassword").value=$("secondPasswordAgain").value="";await reloadSecurity()}catch(e){PortalAPI.status("status",e.message,"error")}};$("disableSecond").onclick=async()=>{if(demo)return;try{const r=await PortalAPI.request("/api/security/second-password",{method:"DELETE",body:{currentSecondPassword:$("currentSecond").value}});PortalAPI.status("status",r.message,"success");$("currentSecond").value="";await reloadSecurity()}catch(e){PortalAPI.status("status",e.message,"error")}};(async()=>{try{const s=await PortalAPI.init();demo=!!s.isDemo;$("firstName").textContent=s.firstName||"-";$("lastName").textContent=s.lastName||"-";$("phone").textContent=s.phone||"-";$("personnelCode").textContent=s.username||s.personnelCode||"-";if(demo){$("demoLock").classList.add("show");document.querySelectorAll("input,button").forEach(x=>x.disabled=true)}await reloadSecurity()}catch(e){PortalAPI.status("status",e.message,"error")}})();})();
</script></body></html>
