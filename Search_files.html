<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جست‌وجوی فایل‌ها</title>
    <link rel="icon" type="image/png" href="/personalspace-icon.png">

    <link
        rel="stylesheet"
        href="/vendor/persian-datepicker.min.css"
    >

    <link
        rel="stylesheet"
        href="/app.css"
    >

    <style>
        .datepicker-container {
            z-index: 99999 !important;
        }

        .datepicker-plot-area {
            z-index: 99999 !important;
        }

        #dateFrom,
        #dateTo {
            cursor: pointer;
            text-align: center;
            direction: ltr;
        }
        :root {
            --search-primary: #2563eb;
            --search-primary-dark: #1d4ed8;
            --search-text: #172033;
            --search-muted: #64748b;
            --search-border: rgba(148, 163, 184, 0.28);
            --search-card: rgba(255, 255, 255, 0.91);
            --search-soft: rgba(248, 250, 252, 0.88);
            --search-danger: #dc2626;
            --search-success: #16a34a;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            direction: ltr;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 34px 28px 50px;
            direction: rtl;
            overflow-y: auto;
            overflow-x: hidden;
            color: var(--search-text);
        }

        .search-page {
            width: min(1120px, 100%);
            margin: 0 auto;
        }

        .search-header {
            margin-bottom: 18px;
        }

        .search-title {
            margin: 0;
            font-size: 28px;
            font-weight: 850;
            color: var(--search-text);
        }

        .search-subtitle {
            margin: 7px 0 0;
            color: var(--search-muted);
            font-size: 13px;
            line-height: 1.9;
        }

        .search-panel {
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid var(--search-border);
            border-radius: 18px;
            background: var(--search-card);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .search-main-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            margin-bottom: 13px;
        }

        .search-input-wrap {
            position: relative;
            min-width: 0;
        }

        .search-input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 14px;
            border: 1px solid var(--search-border);
            border-radius: 12px;
            outline: none;
            background: #ffffff;
            color: var(--search-text);
            font: inherit;
            font-size: 13px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .search-input:focus,
        .filter-field input:focus,
        .filter-field select:focus {
            border-color: var(--search-primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--search-muted);
            pointer-events: none;
        }

        .search-btn,
        .reset-btn {
            min-width: 118px;
            height: 46px;
            padding: 0 17px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--search-primary), var(--search-primary-dark));
            color: #ffffff;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.20);
        }

        .reset-btn {
            background: #f1f5f9;
            color: #475569;
            box-shadow: none;
        }

        .search-btn:disabled,
        .reset-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
            align-items: end;
        }

        .filter-field {
            min-width: 0;
        }

        .filter-field label {
            display: block;
            margin: 0 0 6px;
            color: var(--search-muted);
            font-size: 10.5px;
            font-weight: 700;
        }

        .filter-field input,
        .filter-field select {
            width: 100%;
            height: 41px;
            padding: 0 10px;
            border: 1px solid var(--search-border);
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: var(--search-text);
            font: inherit;
            font-size: 11px;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        .filter-actions .reset-btn {
            width: 100%;
            min-width: 0;
            height: 41px;
        }

        .search-status {
            display: none;
            margin-bottom: 14px;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.8;
        }

        .search-status.show {
            display: block;
        }

        .search-status.error {
            color: #991b1b;
            border: 1px solid #fecaca;
            background: #fef2f2;
        }

        .search-status.info {
            color: #1e40af;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
        }

        .results-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 11px;
        }

        .results-count {
            color: var(--search-muted);
            font-size: 12px;
            font-weight: 700;
        }

        .results-count strong {
            color: var(--search-text);
            font-weight: 850;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .file-result {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            padding: 15px 17px;
            border: 1px solid var(--search-border);
            border-radius: 16px;
            background: var(--search-card);
            box-shadow: 0 7px 22px rgba(15, 23, 42, 0.05);
        }

        .file-info {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #eff6ff;
            font-size: 21px;
        }

        .file-text {
            min-width: 0;
        }

        .file-name {
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--search-text);
            font-size: 13.5px;
            font-weight: 820;
        }

        .file-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 14px;
            color: var(--search-muted);
            font-size: 10.5px;
            line-height: 1.8;
        }

        .file-meta strong {
            color: #475569;
            font-weight: 750;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .file-action-btn {
            min-width: 96px;
            height: 38px;
            padding: 0 13px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            background: #eff6ff;
            color: var(--search-primary-dark);
            font: inherit;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: none;
        }

        .file-action-btn:hover {
            background: var(--search-primary);
            color: #ffffff;
        }

        .empty-state,
        .loading-state {
            padding: 38px 20px;
            text-align: center;
            border: 1px dashed rgba(148, 163, 184, 0.45);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.78);
            color: var(--search-muted);
            font-size: 12px;
            line-height: 2;
        }

        .empty-icon {
            display: block;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .pagination {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }

        .pagination.show {
            display: flex;
        }

        .page-btn {
            min-width: 88px;
            height: 38px;
            padding: 0 13px;
            border: 1px solid var(--search-border);
            border-radius: 10px;
            background: #ffffff;
            color: #475569;
            font: inherit;
            font-size: 11px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: none;
        }

        .page-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .page-info {
            min-width: 110px;
            text-align: center;
            color: var(--search-muted);
            font-size: 11px;
            font-weight: 700;
        }

        @media (max-width: 1000px) {
            .filters-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 24px 14px 40px;
            }

            .search-main-row {
                grid-template-columns: 1fr;
            }

            .filters-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .search-btn {
                width: 100%;
            }

            .file-result {
                grid-template-columns: 1fr;
            }

            .file-actions {
                width: 100%;
            }

            .file-action-btn {
                width: 100%;
            }
        }

        @media (max-width: 460px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }

            .search-title {
                font-size: 23px;
            }
        }
    </style>

    <script src="./site-config.js"></script>
    <script src="./api-bridge.js"></script>

<body>

<main class="search-page">
    <header class="search-header">
        <h1 class="search-title">جست‌وجوی فایل‌ها</h1>
        <p class="search-subtitle">
            فایل‌های فعال خود را بر اساس نام، نوع، حجم و تاریخ ثبت پیدا کنید.
        </p>
    </header>

    <section class="search-panel">
        <form id="searchForm">
            <div class="search-main-row">
                <div class="search-input-wrap">
                    <span class="search-icon">⌕</span>
                    <input
                        id="searchQuery"
                        class="search-input"
                        type="search"
                        maxlength="200"
                        autocomplete="off"
                        placeholder="نام فایل، عنوان یا پسوند را وارد کنید..."
                    >
                </div>

                <button id="searchButton" class="search-btn" type="submit">
                    جست‌وجو
                </button>
            </div>

            <div class="filters-grid">
                <div class="filter-field">
                    <label for="fileType">نوع فایل</label>
                    <select id="fileType">
                        <option value="all">همه فایل‌ها</option>
                        <option value="pdf">PDF</option>
                        <option value="docx">Word</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label for="dateFrom">از تاریخ</label>

                    <input
                        id="dateFrom"
                        type="text"
                        placeholder="مثلاً ۱۴۰۵/۰۶/۰۱"
                        autocomplete="off"
                        readonly
                     data-persian-input>
                </div>

                <div class="filter-field">
                    <label for="dateTo">تا تاریخ</label>

                    <input
                        id="dateTo"
                        type="text"
                        placeholder="مثلاً ۱۴۰۵/۰۶/۳۰"
                        autocomplete="off"
                        readonly
                     data-persian-input>
                </div>

                <div class="filter-field">
                    <label for="minSize">حداقل حجم (MB)</label>
                    <input id="minSize" type="text" min="0" step="0.1" placeholder="0" data-persian-input inputmode="decimal">
                </div>

                <div class="filter-field">
                    <label for="maxSize">حداکثر حجم (MB)</label>
                    <input id="maxSize" type="text" min="0" step="0.1" placeholder="20" data-persian-input inputmode="decimal">
                </div>

                <div class="filter-field">
                    <label for="sortBy">مرتب‌سازی</label>
                    <select id="sortBy">
                        <option value="newest">جدیدترین</option>
                        <option value="oldest">قدیمی‌ترین</option>
                        <option value="name_asc">نام A تا Z</option>
                        <option value="name_desc">نام Z تا A</option>
                        <option value="size_desc">بیشترین حجم</option>
                        <option value="size_asc">کمترین حجم</option>
                    </select>
                </div>

                <div class="filter-field">
                    <label for="perPage">تعداد در صفحه</label>
                    <select id="perPage">
                        <option value="10">۱۰ فایل</option>
                        <option value="20" selected>۲۰ فایل</option>
                        <option value="50">۵۰ فایل</option>
                    </select>
                </div>

                <div class="filter-field filter-actions">
                    <button id="resetButton" class="reset-btn" type="button">
                        پاک‌کردن فیلترها
                    </button>
                </div>
            </div>
        </form>
    </section>

    <div id="searchStatus" class="search-status"></div>

    <div class="results-toolbar">
        <div id="resultsCount" class="results-count">
            در حال دریافت فایل‌ها...
        </div>
    </div>

    <section id="resultsList" class="results-list">
        <div class="loading-state">در حال دریافت فایل‌ها...</div>
    </section>

    <nav id="pagination" class="pagination" aria-label="صفحه‌بندی نتایج">
        <button id="previousPage" class="page-btn" type="button">صفحه قبل</button>
        <span id="pageInfo" class="page-info">-</span>
        <button id="nextPage" class="page-btn" type="button">صفحه بعد</button>
    </nav>
</main>

<script>
    "use strict";

    let currentPage = 1;
    let totalPages = 0;
    let searchBusy = false;

    function toPersianDigits(value) {
        return String(value).replace(/\d/g, function (digit) {
            return "۰۱۲۳۴۵۶۷۸۹"[Number(digit)];
        });
    }

    function formatBytes(bytes) {
        const value = Number(bytes || 0);

        if (!Number.isFinite(value) || value <= 0) {
            return "۰ بایت";
        }

        const units = ["بایت", "KB", "MB", "GB", "TB"];
        const index = Math.min(
            Math.floor(Math.log(value) / Math.log(1024)),
            units.length - 1
        );

        const converted = value / Math.pow(1024, index);
        let text;

        if (index === 0) {
            text = Math.round(converted).toString();
        } else if (converted >= 100) {
            text = converted.toFixed(0);
        } else if (converted >= 10) {
            text = converted.toFixed(1);
        } else {
            text = converted.toFixed(2);
        }

        return toPersianDigits(text) + " " + units[index];
    }

    function formatDate(value) {
        if (!value) {
            return "-";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return "-";
        }

        return date.toLocaleString("fa-IR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function fileIcon(file) {
        const mime = String(file.mimeType || "").toLowerCase();
        const extension = String(file.extension || "").toLowerCase();

        if (file.isPdf || extension === "pdf") return "PDF";
        if (extension === "doc" || extension === "docx") return "DOC";
        if (mime.startsWith("image/")) return "IMG";
        if (mime.startsWith("video/")) return "VID";
        if (mime.startsWith("audio/")) return "AUD";
        return "FILE";
    }

    function typeLabel(file) {
        const mime = String(file.mimeType || "").toLowerCase();
        const extension = String(file.extension || "").toUpperCase();

        if (file.isPdf) return "PDF";
        if (file.fileKind === "docx") return "Word";
        if (mime.startsWith("image/")) return "تصویر";
        if (mime.startsWith("video/")) return "ویدئو";
        if (mime.startsWith("audio/")) return "صوت";
        return extension || "سایر";
    }

    function showStatus(text, type) {
        const box = document.getElementById("searchStatus");
        box.textContent = text || "";
        box.className = "search-status";

        if (text) {
            box.classList.add("show", type || "info");
        }
    }
    function normalizeDateDigits(value) {
        return String(value || "")
            .replace(/[۰-۹]/g, function (digit) {
                return "۰۱۲۳۴۵۶۷۸۹".indexOf(digit);
            })
            .replace(/[٠-٩]/g, function (digit) {
                return "٠١٢٣٤٥٦٧٨٩".indexOf(digit);
            });
    }


    function jalaliToGregorian(jy, jm, jd) {

        jy = Number(jy);
        jm = Number(jm);
        jd = Number(jd);

        jy += 1595;

        let days =
            -355668 +
            (365 * jy) +
            (Math.floor(jy / 33) * 8) +
            Math.floor(((jy % 33) + 3) / 4) +
            jd;

        if (jm < 7) {
            days += (jm - 1) * 31;
        } else {
            days += ((jm - 7) * 30) + 186;
        }

        let gy =
            400 *
            Math.floor(days / 146097);

        days %= 146097;

        if (days > 36524) {

            gy +=
                100 *
                Math.floor(
                    --days / 36524
                );

            days %= 36524;

            if (days >= 365) {
                days++;
            }
        }

        gy +=
            4 *
            Math.floor(days / 1461);

        days %= 1461;

        if (days > 365) {

            gy +=
                Math.floor(
                    (days - 1) / 365
                );

            days =
                (days - 1) % 365;
        }

        let gd = days + 1;

        const leap =
            (
                gy % 4 === 0 &&
                gy % 100 !== 0
            ) ||
            gy % 400 === 0;

        const monthDays = [
            0,
            31,
            leap ? 29 : 28,
            31,
            30,
            31,
            30,
            31,
            31,
            30,
            31,
            30,
            31
        ];

        let gm = 1;

        while (
            gm <= 12 &&
            gd > monthDays[gm]
        ) {
            gd -= monthDays[gm];
            gm++;
        }

        return {
            year: gy,
            month: gm,
            day: gd
        };
    }


    function jalaliDateToGregorian(value) {

        value =
            normalizeDateDigits(value)
                .trim()
                .replace(/-/g, "/")
                .replace(/\./g, "/");

        if (!value) {
            return "";
        }

        const parts =
            value.split("/");

        if (parts.length !== 3) {
            return "";
        }

        const jy = Number(parts[0]);
        const jm = Number(parts[1]);
        const jd = Number(parts[2]);

        if (
            !Number.isInteger(jy) ||
            !Number.isInteger(jm) ||
            !Number.isInteger(jd)
        ) {
            return "";
        }

        if (
            jm < 1 ||
            jm > 12 ||
            jd < 1 ||
            jd > 31
        ) {
            return "";
        }

        const result =
            jalaliToGregorian(
                jy,
                jm,
                jd
            );

        const month =
            String(result.month)
                .padStart(2, "0");

        const day =
            String(result.day)
                .padStart(2, "0");

        return (
            result.year +
            "-" +
            month +
            "-" +
            day
        );
    }
    function getSearchParams(page) {
        const params = new URLSearchParams();
        const query = document.getElementById("searchQuery").value.trim();
        const type = document.getElementById("fileType").value;
        const dateFromJalali =
            document.getElementById(
                "dateFrom"
            ).value;

        const dateToJalali =
            document.getElementById(
                "dateTo"
            ).value;


        const dateFrom =
            jalaliDateToGregorian(
                dateFromJalali
            );

        const dateTo =
            jalaliDateToGregorian(
                dateToJalali
            );
        const minSize = PersianDigits.value(document.getElementById("minSize")).trim();
        const maxSize = PersianDigits.value(document.getElementById("maxSize")).trim();
        const sort = document.getElementById("sortBy").value;
        const perPage = document.getElementById("perPage").value;

        if (query) params.set("q", query);
        if (type) params.set("type", type);
        if (dateFrom) params.set("date_from", dateFrom);
        if (dateTo) params.set("date_to", dateTo);
        if (minSize) params.set("min_size_mb", minSize);
        if (maxSize) params.set("max_size_mb", maxSize);

        params.set("sort", sort);
        params.set("page", String(page));
        params.set("per_page", perPage);

        return params;
    }

    function createFileResult(file) {
        const card = document.createElement("article");
        card.className = "file-result";

        const info = document.createElement("div");
        info.className = "file-info";

        const icon = document.createElement("div");
        icon.className = "file-icon";
        icon.textContent = fileIcon(file);

        const textBox = document.createElement("div");
        textBox.className = "file-text";

        const name = document.createElement("div");
        name.className = "file-name";
        name.textContent = file.name || file.originalName || "فایل بدون نام";
        name.title = name.textContent;

        const meta = document.createElement("div");
        meta.className = "file-meta";

        const type = document.createElement("span");
        type.innerHTML = "نوع: <strong></strong>";
        type.querySelector("strong").textContent = typeLabel(file);

        const size = document.createElement("span");
        size.innerHTML = "حجم: <strong></strong>";
        size.querySelector("strong").textContent = formatBytes(file.sizeBytes);

        const date = document.createElement("span");
        date.innerHTML = "تاریخ ثبت: <strong></strong>";
        date.querySelector("strong").textContent = formatDate(file.createdAt);

        meta.appendChild(type);
        if (file.passwordProtected) {
            const locked = document.createElement("span");
            locked.textContent = "🔒 رمزدار";
            meta.appendChild(locked);
        }
        meta.appendChild(size);
        meta.appendChild(date);

        textBox.appendChild(name);
        textBox.appendChild(meta);

        info.appendChild(icon);
        info.appendChild(textBox);

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const openButton = document.createElement("button");
        openButton.type = "button";
        openButton.className = "file-action-btn";
        openButton.textContent = file.isPdf ? "مشاهده" : "دریافت فایل";
        openButton.addEventListener("click", async function () {
            let filePassword = "";
            if (file.passwordProtected) {
                filePassword = window.prompt("این فایل با رمز محافظت می‌شود. رمز فایل را وارد کنید:") || "";
                if (!filePassword) return;
            }
            try {
                const headers = {};
                if (filePassword) headers["X-File-Password"] = filePassword;
                const response = await fetch(file.downloadUrl || file.url, {
                    credentials: "same-origin", headers
                });
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    throw new Error(data.message || "دریافت فایل انجام نشد.");
                }
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = objectUrl;
                anchor.download = file.originalName || file.name || "file";
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
            } catch (error) {
                showStatus(error.message || "دریافت فایل انجام نشد.", "error");
            }
        });

        actions.appendChild(openButton);
        card.appendChild(info);
        card.appendChild(actions);

        return card;
    }

    function renderResults(result) {
        const list = document.getElementById("resultsList");
        const count = document.getElementById("resultsCount");
        const pagination = document.getElementById("pagination");
        const pageInfo = document.getElementById("pageInfo");
        const previousButton = document.getElementById("previousPage");
        const nextButton = document.getElementById("nextPage");

        const files = Array.isArray(result.files) ? result.files : [];
        const paginationData = result.pagination || {};
        const total = Number(paginationData.total || 0);

        currentPage = Number(paginationData.page || 1);
        totalPages = Number(paginationData.totalPages || 0);

        count.innerHTML = "تعداد نتیجه: <strong>" + toPersianDigits(total) + "</strong> فایل";
        list.innerHTML = "";

        if (files.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.innerHTML = "<span class=\"empty-icon\">⌕</span>فایلی با این فیلترها پیدا نشد.";
            list.appendChild(empty);
            pagination.classList.remove("show");
            return;
        }

        files.forEach(function (file) {
            list.appendChild(createFileResult(file));
        });

        if (totalPages > 1) {
            pagination.classList.add("show");
            pageInfo.textContent =
                "صفحه " + toPersianDigits(currentPage) +
                " از " + toPersianDigits(totalPages);
            previousButton.disabled = currentPage <= 1;
            nextButton.disabled = currentPage >= totalPages;
        } else {
            pagination.classList.remove("show");
        }
    }

    async function searchFiles(page = 1) {
        if (searchBusy) {
            return;
        }

        searchBusy = true;
        showStatus("", "");

        const searchButton = document.getElementById("searchButton");
        const resetButton = document.getElementById("resetButton");
        const list = document.getElementById("resultsList");

        searchButton.disabled = true;
        resetButton.disabled = true;
        searchButton.textContent = "در حال جست‌وجو...";

        list.innerHTML = "<div class=\"loading-state\">در حال جست‌وجوی فایل‌ها...</div>";

        try {
            const params = getSearchParams(page);
            const response = await fetch("/api/files/search?" + params.toString(), {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            if (response.status === 401) {
                window.parent.location.replace("/Login.html");
                return;
            }

            const result = await response.json();

            if (!response.ok || !result.ok) {
                throw new Error(result.message || "جست‌وجوی فایل‌ها انجام نشد.");
            }

            renderResults(result);
        } catch (error) {
            console.error("FILE SEARCH ERROR:", error);
            document.getElementById("resultsCount").textContent = "جست‌وجو انجام نشد.";
            list.innerHTML = "<div class=\"empty-state\">خطا در دریافت نتایج جست‌وجو.</div>";
            document.getElementById("pagination").classList.remove("show");
            showStatus(error.message || "ارتباط با سرور برقرار نشد.", "error");
        } finally {
            searchBusy = false;
            searchButton.disabled = false;
            resetButton.disabled = false;
            searchButton.textContent = "جست‌وجو";
        }
    }

    async function verifySession() {
        const response = await fetch("/api/session", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store"
        });

        if (!response.ok) {
            window.parent.location.replace("/Login.html");
            return false;
        }

        const result = await response.json();
        if (!result.loggedIn) {
            window.parent.location.replace("/Login.html");
            return false;
        }

        return true;
    }

    document.getElementById("searchForm").addEventListener("submit", function (event) {
        event.preventDefault();
        currentPage = 1;
        searchFiles(1);
    });

    document.getElementById("resetButton").addEventListener("click", function () {
        document.getElementById("searchQuery").value = "";
        document.getElementById("fileType").value = "all";
        document.getElementById("dateFrom").value = "";
        document.getElementById("dateTo").value = "";
        document.getElementById("minSize").value = "";
        document.getElementById("maxSize").value = "";
        document.getElementById("sortBy").value = "newest";
        document.getElementById("perPage").value = "20";
        currentPage = 1;
        searchFiles(1);
    });

    document.getElementById("previousPage").addEventListener("click", function () {
        if (currentPage > 1) {
            searchFiles(currentPage - 1);
        }
    });

    document.getElementById("nextPage").addEventListener("click", function () {
        if (currentPage < totalPages) {
            searchFiles(currentPage + 1);
        }
    });

    document.getElementById("fileType").addEventListener("change", function () {
        searchFiles(1);
    });

    document.getElementById("sortBy").addEventListener("change", function () {
        searchFiles(1);
    });

    document.getElementById("perPage").addEventListener("change", function () {
        searchFiles(1);
    });

    document.addEventListener("DOMContentLoaded", async function () {
        try {
            const loggedIn = await verifySession();
            if (loggedIn) {
                await searchFiles(1);
            }
        } catch (error) {
            console.error("SEARCH PAGE INIT ERROR:", error);
            showStatus("راه‌اندازی صفحه جست‌وجو انجام نشد.", "error");
        }
    });
</script>
