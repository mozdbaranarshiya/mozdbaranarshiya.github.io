<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تیکت‌ها</title>

  <script src="/site-config.js"></script>
  <script src="/api-bridge.js"></script>
  <link rel="stylesheet" href="/design-system.css?v=20260922-1">
</head><body><div class="admin-page"><div class="admin-page-header"><div><h1 class="admin-page-title">تیکت‌ها</h1><p class="admin-page-subtitle">پاسخ به درخواست کاربران و باز/بسته کردن تیکت.</p></div><select id="filter" class="portal-select" style="width:auto"><option value="all">همه</option><option value="open">باز</option><option value="closed">بسته</option></select></div><div id="status" class="admin-status"></div><div class="portal-grid" style="grid-template-columns:minmax(280px,1fr) minmax(360px,2fr)"><section class="admin-card admin-card-pad"><div id="list" class="admin-loading">در حال دریافت...</div></section><section class="admin-card admin-card-pad"><div id="detail" class="portal-empty">یک تیکت را انتخاب کنید.</div></section></div></div><script src="/admin.js"></script><script>
let current=null;const badge=s=>`<span class="portal-badge ${s}">${s==='open'?'باز':'بسته'}</span>`;async function load(){try{await AdminAPI.init();const d=await AdminAPI.request('/api/admin/portal/tickets?status='+filter.value);const a=d.tickets||[];list.innerHTML=a.length?a.map(t=>`<button class="portal-card" style="width:100%;text-align:right;cursor:pointer" onclick="showTicket(${t.id})"><b>${AdminAPI.esc(t.subject)}</b><div>${AdminAPI.esc(t.userName)} - ${AdminAPI.esc(t.ticketCode)}</div><div>${badge(t.status)}</div></button>`).join(''):'<div class="portal-empty">تیکتی وجود ندارد.</div>'}catch(e){AdminAPI.status('status',e.message,'error')}}async function showTicket(id){try{const d=await AdminAPI.request('/api/admin/portal/tickets/'+id);current=d.ticket;render()}catch(e){AdminAPI.status('status',e.message,'error')}}function render(){const t=current;detail.innerHTML=`<h2>${AdminAPI.esc(t.subject)}</h2><div class="portal-muted">${AdminAPI.esc(t.userName)} | ${AdminAPI.esc(t.personnelCode)} | ${AdminAPI.esc(t.ticketCode)} | ${badge(t.status)}</div><div style="margin:14px 0">${t.messages.map(m=>`<div class="portal-message ${m.senderRole==='manager'?'manager':''}"><div class="meta">${m.senderRole==='manager'?'مدیر':'کاربر'} - ${AdminAPI.esc(m.createdAt)}</div><div>${AdminAPI.esc(m.body).replace(/\n/g,'<br>')}</div></div>`).join('')}</div><textarea id="reply" class="portal-textarea" placeholder="پاسخ مدیر" ${t.status==='closed'?'disabled':''}></textarea><div class="portal-actions" style="margin-top:8px"><button class="admin-btn primary" onclick="sendReply()" ${t.status==='closed'?'disabled':''}>ارسال پاسخ</button><button class="admin-btn" onclick="setStatus('${t.status==='open'?'closed':'open'}')">${t.status==='open'?'بستن تیکت':'باز کردن تیکت'}</button></div>`}async function sendReply(){try{await AdminAPI.request('/api/admin/portal/tickets/'+current.id+'/reply',{method:'POST',body:JSON.stringify({body:document.getElementById('reply').value})});await showTicket(current.id);AdminAPI.status('status','پاسخ ثبت شد و پیام بله برای کاربر ارسال شد.','success')}catch(e){AdminAPI.status('status',e.message,'error')}}async function setStatus(s){try{await AdminAPI.request('/api/admin/portal/tickets/'+current.id+'/status',{method:'POST',body:JSON.stringify({status:s})});await showTicket(current.id);load()}catch(e){AdminAPI.status('status',e.message,'error')}}filter.onchange=load;(async()=>{await load();const id=Number(new URLSearchParams(location.search).get('ticketId')||0);if(id>0)showTicket(id)})();
</script>
</body></html>
